<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root { box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Sarabun, "Noto Sans Thai", system-ui, sans-serif; background: #0E1326; color: #EEF1FA; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
button[disabled] { cursor: not-allowed; }
sup { font-size: .6em; line-height: 0; }
.hd { font-family: Prompt, "Noto Sans Thai", sans-serif; }

/* ---------- role screen ---------- */
.role { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; max-width: 520px; margin: 0 auto; padding: 24px 16px; }
.role h1 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 2rem; margin: 0; line-height: 1.3; }
.role p { margin: 0; color: #B4BEDA; line-height: 1.5; }
.rbtn { min-height: 64px; border-radius: 16px; border: 2px solid #9C8CFF; background: transparent; color: #EEF1FA; font-weight: 700; font-size: 1.15rem; padding: 10px 16px; text-align: left; }
.rbtn.pri { background: #9C8CFF; color: #0E1326; }
.rbtn small { display: block; font-weight: 400; font-size: .9rem; opacity: .9; }
.note { padding: 10px 14px; border: 1px dashed #5A6785; border-radius: 12px; color: #B4BEDA; font-size: .9rem; line-height: 1.5; }

/* ---------- connection badge ---------- */
#netb { position: fixed; z-index: 60; pointer-events: none; left: 10px; bottom: 6px; font: 12px/1 Sarabun, "Noto Sans Thai", sans-serif; opacity: .85; color: #B4BEDA; }
#netb.ok { color: #5BD98F; } #netb.local { color: #FFD65A; } #netb.bad { color: #FF8A80; }
body.ph #netb { left: auto; bottom: auto; right: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; font-size: 0; background: #9AA5C0; }
body.ph #netb.ok { background: #2E9E6B; } body.ph #netb.local { background: #D9A400; } body.ph #netb.bad { background: #D64545; }

/* ---------- HOST stage (1920x1080, scaled to the window) ---------- */
#hostwrap { position: fixed; inset: 0; background: #0E1326; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; padding: 40px 64px; display: flex; flex-direction: column; gap: 24px; overflow: hidden; color: #EEF1FA; }
#stage .hdr { height: 124px; display: flex; align-items: center; justify-content: space-between; flex: none; }
#stage .hl, #stage .hr { width: 520px; }
#stage .hr { display: flex; justify-content: flex-end; }
#stage .s1 { font-size: 28px; line-height: 1.3; color: #B4BEDA; }
#stage .s2 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 48px; line-height: 1.3; }
#stage .hc2 { text-align: center; }

#stage .ring { width: 124px; height: 124px; border-radius: 50%; border: 10px solid #9C8CFF; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 64px; line-height: 1; }
#stage .pill { padding: 6px 36px; border-radius: 99px; border: 4px solid #9C8CFF; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 44px; line-height: 1.3; }
#stage .main { flex: 1; min-height: 0; display: flex; align-items: center; gap: 56px; }
#stage .ftr { height: 72px; display: flex; align-items: center; justify-content: space-between; flex: none; }
#stage .ft1 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 44px; line-height: 1.3; }
#stage .hint { font-size: 30px; line-height: 1.3; color: #B4BEDA; }
#stage .bar { width: 520px; height: 20px; border-radius: 10px; background: #2B3560; }
#stage .bar div { height: 20px; border-radius: 10px; background: #5BD98F; }
.gb { font-size: 28px; line-height: 1.3; min-height: 56px; padding: 0 28px; border-radius: 14px; border: 2px solid #5A6785; background: transparent; color: #EEF1FA; }
.endb { position: absolute; right: 64px; bottom: 2px; font-size: 22px; min-height: 36px; padding: 0 20px; border-color: #2B3560; color: #B4BEDA; }
.endov { position: absolute; inset: 0; z-index: 20; background: rgba(5, 8, 20, .82); display: flex; align-items: center; justify-content: center; }
.endbox { width: 1100px; padding: 56px; border-radius: 32px; background: #171E38; border: 3px solid #2B3560; display: flex; flex-direction: column; gap: 24px; text-align: center; }
.pb { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.3; min-height: 72px; padding: 0 56px; border-radius: 18px; border: 0; background: #9C8CFF; color: #0E1326; }
.pb[disabled] { opacity: .35; }
.hc { width: 190px; height: 136px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: #171E38; border: 3px solid #2B3560; color: #EEF1FA; line-height: 1.2; font-family: Prompt, "Noto Sans Thai", sans-serif; }
.hc b { font-size: 52px; line-height: 1.1; font-weight: 700; }
.hc .nm { font-size: 26px; font-weight: 600; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hc .sc { font-size: 24px; font-weight: 500; opacity: .85; }
.hc.t { color: #0E1326; border-color: transparent; }
.hc .bd { position: absolute; top: -14px; right: -14px; width: 52px; height: 52px; background: #FFD65A; color: #0E1326; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; font-weight: 700; }
.prow2 { display: flex; gap: 12px; justify-content: center; }
.nt { width: 220px; height: 190px; border-radius: 20px; background: #171E38; border: 3px solid #2B3560; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 100px; line-height: 1.1; }
.cd { width: 400px; height: 380px; border-radius: 28px; background: #171E38; border: 8px solid #2B3560; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: Prompt, "Noto Sans Thai", sans-serif; line-height: 1.25; }

.dl { display: flex; align-items: center; gap: 10px; padding: 6px 26px; border-radius: 99px; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.3; }
.up { background: #12332A; color: #5BD98F; }
.dn { background: #3A1C22; color: #FF8A80; }
.ze { background: #2B3560; color: #EEF1FA; }
.chip { display: flex; align-items: center; gap: 14px; padding: 10px 26px 10px 20px; border-radius: 99px; background: #171E38; border: 2px solid #2B3560; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 600; font-size: 38px; line-height: 1.3; }
.chip.sm { font-size: 28px; padding: 6px 18px 6px 14px; gap: 10px; } .chip.sm i { width: 16px; height: 16px; }
.chip.xs { font-size: 22px; padding: 3px 14px 3px 10px; gap: 8px; border-width: 1px; } .chip.xs i { width: 13px; height: 13px; }
.chip i { width: 22px; height: 22px; border-radius: 50%; display: block; flex: none; }
.lr { height: 80px; display: flex; align-items: center; gap: 20px; font-family: Prompt, "Noto Sans Thai", sans-serif; line-height: 1.3; }
.lr .rk { width: 64px; text-align: center; font-weight: 700; font-size: 44px; color: #B4BEDA; }
.lr .nm { width: 300px; display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 46px; overflow: hidden; white-space: nowrap; }

.lr .bar2 div { height: 30px; border-radius: 15px; background: #9C8CFF; }
.lr .sc2 { width: 110px; text-align: right; font-weight: 700; font-size: 58px; }
.lr .dl2 { width: 150px; display: flex; justify-content: center; padding: 4px 0; border-radius: 99px; font-weight: 700; font-size: 40px; }
.rcard { width: 100%; box-sizing: border-box; padding: 36px 48px; border-radius: 32px; background: #171E38; border: 6px solid #2B3560; display: flex; flex-direction: column; gap: 26px; }

/* ---------- host settings overlay (normal size, for the Host's own screen) ---------- */
#cfgov { position: fixed; inset: 0; background: rgba(5, 8, 20, .78); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
#cfgov .box { background: #171E38; border: 1px solid #2B3560; border-radius: 16px; width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 18px; }
#cfgov h2 { font-family: Prompt, "Noto Sans Thai", sans-serif; margin: 0 0 10px; font-size: 1.3rem; }
#cfgov .field { display: grid; grid-template-columns: 1fr 140px; gap: 8px; align-items: center; margin-bottom: 8px; }
#cfgov .field.wide { grid-template-columns: 1fr; }
#cfgov input[type=text], #cfgov input[type=number], #cfgov select { font: inherit; font-size: 1rem; min-height: 44px; padding: 6px 10px; color: #EEF1FA; background: #0E1326; border: 1px solid #2B3560; border-radius: 10px; width: 100%; min-width: 0; }
#cfgov .rng { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
#cfgov .check { display: flex; gap: 10px; align-items: center; min-height: 44px; }
#cfgov .check input { width: 22px; height: 22px; }
#cfgov .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#cfgov .row3 label { display: block; font-size: .85rem; color: #B4BEDA; }
#cfgov .warn { padding: 8px 12px; border-radius: 10px; background: #3A3010; color: #FFD65A; margin: 0 0 10px; }
#cfgov .sm { font-size: .9rem; color: #B4BEDA; margin: 10px 0 4px; }
#cfgov .done { width: 100%; margin-top: 10px; min-height: 52px; border-radius: 12px; border: 0; background: #9C8CFF; color: #0E1326; font-weight: 700; font-size: 1.05rem; }

/* ---------- PLAYER (phone) ---------- */
#pw { height: 100dvh; min-height: 100%; background: #EDF1F9; color: #14213D; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; font-size: 16px; line-height: 1.5; }

#pw .nts.sm div { height: 34px; font-size: 20px; }
#pw .pr { display: flex; gap: 6px; justify-content: center; }
#pw .pc { width: 60px; height: 58px; border-radius: 10px; border: 2px solid #CBD5E8; background: #fff; color: #14213D; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; line-height: 1.15; font-family: Prompt, "Noto Sans Thai", sans-serif; }
#pw .pc b { font-size: 19px; font-weight: 700; }
#pw .pc small { font-size: 12px; font-weight: 500; color: #5A6785; max-width: 54px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pw .pc.t { color: #fff; border-color: transparent; }
#pw .pc.t small { color: #fff; }

#pw .st { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 16px; line-height: 1.4; background: #fff; border: 1px solid #CBD5E8; }
#pw .st.ok { background: #DDF3E6; color: #14562F; border-color: transparent; }
#pw .st small { font-weight: 400; font-size: 14px; color: #5A6785; }
#pw .tg { height: 64px; background: #fff; border: 1px solid #CBD5E8; border-radius: 14px; padding: 0 16px; display: flex; align-items: center; gap: 16px; }
#pw .tg b { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 44px; line-height: 1.1; }

#pw .pv { height: 52px; background: #fff; border: 2px solid #CBD5E8; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 600; font-size: 26px; overflow: hidden; }

#pw .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 136px; align-content: start; }

#pw .ops { display: flex; gap: 8px; }

#pw .box { background: #fff; border: 1px solid #CBD5E8; border-radius: 16px; padding: 16px 18px; }

#pw .fl { display: block; font-size: 15px; line-height: 1.4; font-weight: 700; margin-bottom: 6px; }
#pw .in { width: 100%; min-height: 52px; padding: 6px 14px; border-radius: 12px; border: 2px solid #CBD5E8; background: #fff; color: #14213D; font: inherit; font-size: 20px; }

/* ---- join screen: ticket + keypad ---- */

/* ---- host animations (projector only; skipped when the device asks for reduced motion) ---- */
@keyframes fxPop { 0% { transform: scale(.55); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes fxShake { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-4px) rotate(-1.5deg); } 75% { transform: translateY(4px) rotate(1.5deg); } }
@keyframes fxFall { 0% { transform: translate3d(0, -60px, 0) rotate(0); opacity: 1; } 100% { transform: translate3d(var(--dx), 1180px, 0) rotate(var(--rot)); opacity: .9; } }
@keyframes fxGlow { 0%, 100% { box-shadow: 0 0 0 rgba(255, 214, 90, 0); } 50% { box-shadow: 0 0 36px rgba(255, 214, 90, .75); } }
.rolling { color: #FFD65A; animation: fxShake .18s infinite; }
.fxpop { animation: fxPop .45s ease-out; }
.cf { position: absolute; top: 0; width: 18px; height: 28px; border-radius: 4px; z-index: 30; pointer-events: none; animation: fxFall var(--dur) cubic-bezier(.2, .6, .4, 1) forwards; }

<script>

    '<button class="rbtn" data-r="head">หัวห้องเล่นด้วย<small>ใช้มือถือเครื่องนี้เป็นหัวห้องและเล่นด้วย ไม่ต้องมีจอ Host ไม่นับคะแนนชมรม</small></button></div>';
  app.onclick = function (e) { var b = e.target.closest("[data-r]"); if (!b) return; app.onclick = null; (b.dataset.r === "host" ? hostBoot : headBoot)(); };
}
(function () {
  var r = ss("calcu-role");
  if (location.hash === "#host") hostBoot(); else if (location.hash === "#head") headBoot(); else if (location.hash === "#create") createScreen(); else if (location.hash === "#player" || /^#join=\d{4}$/.test(location.hash)) playerBoot(); else if (r === "host") hostBoot(); else if (r === "head") headBoot(); else if (r === "player") playerBoot(); else roleScreen();
})();
