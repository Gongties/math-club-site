<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcuเหรอ? ต้นแบบเรียลไทม์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Sarabun, "Noto Sans Thai", system-ui, sans-serif; background: #0E1326; color: #EEF1FA; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
button[disabled] { cursor: not-allowed; }
sup { font-size: .6em; line-height: 0; }
.hd { font-family: Prompt, "Noto Sans Thai", sans-serif; }

/* ---------- role screen ---------- */
.role { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; max-width: 520px; margin: 0 auto; padding: 24px 16px; }
.role h1 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 2rem; margin: 0; line-height: 1.3; }
.role p { margin: 0; color: #B4BEDA; line-height: 1.5; }
.rbtn { min-height: 64px; border-radius: 16px; border: 2px solid #9C8CFF; background: transparent; color: #EEF1FA; font-weight: 700; font-size: 1.15rem; padding: 10px 16px; text-align: left; }
.rbtn.pri { background: #9C8CFF; color: #0E1326; }
.rbtn small { display: block; font-weight: 400; font-size: .9rem; opacity: .9; }
.note { padding: 10px 14px; border: 1px dashed #5A6785; border-radius: 12px; color: #B4BEDA; font-size: .9rem; line-height: 1.5; }

/* ---------- connection badge ---------- */
#netb { position: fixed; z-index: 60; pointer-events: none; left: 10px; bottom: 6px; font: 12px/1 Sarabun, "Noto Sans Thai", sans-serif; opacity: .85; color: #B4BEDA; }
#netb.ok { color: #5BD98F; } #netb.local { color: #FFD65A; } #netb.bad { color: #FF8A80; }
body.ph #netb { left: auto; bottom: auto; right: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; font-size: 0; background: #9AA5C0; }
body.ph #netb.ok { background: #2E9E6B; } body.ph #netb.local { background: #D9A400; } body.ph #netb.bad { background: #D64545; }

/* ---------- HOST stage (1920x1080, scaled to the window) ---------- */
#hostwrap { position: fixed; inset: 0; background: #0E1326; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; padding: 40px 64px; display: flex; flex-direction: column; gap: 24px; overflow: hidden; color: #EEF1FA; }
#stage .hdr { height: 124px; display: flex; align-items: center; justify-content: space-between; flex: none; }
#stage .hl, #stage .hr { width: 520px; }
#stage .hr { display: flex; justify-content: flex-end; }
#stage .s1 { font-size: 28px; line-height: 1.3; color: #B4BEDA; }
#stage .s2 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 48px; line-height: 1.3; }
#stage .hc2 { text-align: center; }
#stage .ti { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 56px; line-height: 1.3; }
#stage .su { font-size: 30px; line-height: 1.3; color: #B4BEDA; }
#stage .ring { width: 124px; height: 124px; border-radius: 50%; border: 10px solid #9C8CFF; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 64px; line-height: 1; }
#stage .pill { padding: 6px 36px; border-radius: 99px; border: 4px solid #9C8CFF; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 44px; line-height: 1.3; }
#stage .main { flex: 1; min-height: 0; display: flex; align-items: center; gap: 56px; }
#stage .ftr { height: 72px; display: flex; align-items: center; justify-content: space-between; flex: none; }
#stage .ft1 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 44px; line-height: 1.3; }
#stage .hint { font-size: 30px; line-height: 1.3; color: #B4BEDA; }
#stage .bar { width: 520px; height: 20px; border-radius: 10px; background: #2B3560; }
#stage .bar div { height: 20px; border-radius: 10px; background: #5BD98F; }
.gb { font-size: 28px; line-height: 1.3; min-height: 56px; padding: 0 28px; border-radius: 14px; border: 2px solid #5A6785; background: transparent; color: #EEF1FA; }
.endb { position: absolute; right: 64px; bottom: 2px; font-size: 22px; min-height: 36px; padding: 0 20px; border-color: #2B3560; color: #B4BEDA; }
.endov { position: absolute; inset: 0; z-index: 20; background: rgba(5, 8, 20, .82); display: flex; align-items: center; justify-content: center; }
.endbox { width: 1100px; padding: 56px; border-radius: 32px; background: #171E38; border: 3px solid #2B3560; display: flex; flex-direction: column; gap: 24px; text-align: center; }
.pb { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.3; min-height: 72px; padding: 0 56px; border-radius: 18px; border: 0; background: #9C8CFF; color: #0E1326; }
.pb[disabled] { opacity: .35; }
.hc { width: 190px; height: 136px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: #171E38; border: 3px solid #2B3560; color: #EEF1FA; line-height: 1.2; font-family: Prompt, "Noto Sans Thai", sans-serif; }
.hc b { font-size: 52px; line-height: 1.1; font-weight: 700; }
.hc .nm { font-size: 26px; font-weight: 600; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hc .sc { font-size: 24px; font-weight: 500; opacity: .85; }
.hc.t { color: #0E1326; border-color: transparent; }
.hc .bd { position: absolute; top: -14px; right: -14px; width: 52px; height: 52px; background: #FFD65A; color: #0E1326; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; font-weight: 700; }
.prow2 { display: flex; gap: 12px; justify-content: center; }
.nt { width: 220px; height: 190px; border-radius: 20px; background: #171E38; border: 3px solid #2B3560; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 100px; line-height: 1.1; }
.cd { width: 400px; height: 380px; border-radius: 28px; background: #171E38; border: 8px solid #2B3560; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: Prompt, "Noto Sans Thai", sans-serif; line-height: 1.25; }
.cd b { font-size: 150px; line-height: 1.05; font-weight: 700; }
.cd .n { font-size: 48px; font-weight: 700; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd .s { font-size: 30px; font-weight: 500; color: #B4BEDA; }
.dl { display: flex; align-items: center; gap: 10px; padding: 6px 26px; border-radius: 99px; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.3; }
.up { background: #12332A; color: #5BD98F; }
.dn { background: #3A1C22; color: #FF8A80; }
.ze { background: #2B3560; color: #EEF1FA; }
.chip { display: flex; align-items: center; gap: 14px; padding: 10px 26px 10px 20px; border-radius: 99px; background: #171E38; border: 2px solid #2B3560; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 600; font-size: 38px; line-height: 1.3; }
.chip.sm { font-size: 28px; padding: 6px 18px 6px 14px; gap: 10px; } .chip.sm i { width: 16px; height: 16px; }
.chip.xs { font-size: 22px; padding: 3px 14px 3px 10px; gap: 8px; border-width: 1px; } .chip.xs i { width: 13px; height: 13px; }
.chip i { width: 22px; height: 22px; border-radius: 50%; display: block; flex: none; }
.lr { height: 80px; display: flex; align-items: center; gap: 20px; font-family: Prompt, "Noto Sans Thai", sans-serif; line-height: 1.3; }
.lr .rk { width: 64px; text-align: center; font-weight: 700; font-size: 44px; color: #B4BEDA; }
.lr .nm { width: 300px; display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 46px; overflow: hidden; white-space: nowrap; }
.lr .nm i { width: 24px; height: 24px; border-radius: 50%; display: block; flex: none; }
.lr .bar2 { flex: 1; height: 30px; border-radius: 15px; background: #2B3560; }
.lr .bar2 div { height: 30px; border-radius: 15px; background: #9C8CFF; }
.lr .sc2 { width: 110px; text-align: right; font-weight: 700; font-size: 58px; }
.lr .dl2 { width: 150px; display: flex; justify-content: center; padding: 4px 0; border-radius: 99px; font-weight: 700; font-size: 40px; }
.rcard { width: 1560px; padding: 36px 48px; border-radius: 32px; background: #171E38; border: 6px solid #2B3560; display: flex; flex-direction: column; gap: 26px; }

/* ---------- host settings overlay (normal size, for the Host's own screen) ---------- */
#cfgov { position: fixed; inset: 0; background: rgba(5, 8, 20, .78); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
#cfgov .box { background: #171E38; border: 1px solid #2B3560; border-radius: 16px; width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 18px; }
#cfgov h2 { font-family: Prompt, "Noto Sans Thai", sans-serif; margin: 0 0 10px; font-size: 1.3rem; }
#cfgov .field { display: grid; grid-template-columns: 1fr 140px; gap: 8px; align-items: center; margin-bottom: 8px; }
#cfgov .field.wide { grid-template-columns: 1fr; }
#cfgov input[type=text], #cfgov input[type=number], #cfgov select { font: inherit; font-size: 1rem; min-height: 44px; padding: 6px 10px; color: #EEF1FA; background: #0E1326; border: 1px solid #2B3560; border-radius: 10px; width: 100%; min-width: 0; }
#cfgov .rng { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
#cfgov .check { display: flex; gap: 10px; align-items: center; min-height: 44px; }
#cfgov .check input { width: 22px; height: 22px; }
#cfgov .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#cfgov .row3 label { display: block; font-size: .85rem; color: #B4BEDA; }
#cfgov .warn { padding: 8px 12px; border-radius: 10px; background: #3A3010; color: #FFD65A; margin: 0 0 10px; }
#cfgov .sm { font-size: .9rem; color: #B4BEDA; margin: 10px 0 4px; }
#cfgov .done { width: 100%; margin-top: 10px; min-height: 52px; border-radius: 12px; border: 0; background: #9C8CFF; color: #0E1326; font-weight: 700; font-size: 1.05rem; }

/* ---------- PLAYER (phone) ---------- */
#pw { height: 100dvh; min-height: 100%; background: #EDF1F9; color: #14213D; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; font-size: 16px; line-height: 1.5; }
#pw .ph { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; }
#pw .ph .a { font-size: 13px; line-height: 1.3; color: #5A6785; }
#pw .ph .b { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 19px; line-height: 1.3; }
#pw .tm { min-width: 56px; height: 44px; padding: 0 12px; border-radius: 12px; background: #4B35C9; color: #fff; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 26px; }
#pw .tm.tag { background: transparent; border: 2px solid #4B35C9; color: #4B35C9; font-size: 14px; line-height: 1.2; text-align: center; font-weight: 700; }
#pw .card { background: #fff; border: 1px solid #CBD5E8; border-radius: 14px; padding: 10px; }
#pw .lab { font-size: 13px; line-height: 1.4; color: #5A6785; margin-bottom: 4px; }
#pw .nts { display: flex; gap: 8px; }
#pw .nts div { flex: 1; height: 44px; border-radius: 10px; background: #fff; border: 1px solid #CBD5E8; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 24px; }
#pw .nts.sm div { height: 34px; font-size: 20px; }
#pw .pr { display: flex; gap: 6px; justify-content: center; }
#pw .pc { width: 60px; height: 58px; border-radius: 10px; border: 2px solid #CBD5E8; background: #fff; color: #14213D; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; line-height: 1.15; font-family: Prompt, "Noto Sans Thai", sans-serif; }
#pw .pc b { font-size: 19px; font-weight: 700; }
#pw .pc small { font-size: 12px; font-weight: 500; color: #5A6785; max-width: 54px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pw .pc.t { color: #fff; border-color: transparent; }
#pw .pc.t small { color: #fff; }
#pw .pc.me { box-shadow: 0 0 0 3px #14213D; }
#pw .pc.gray { background: #E3E8F3; color: #5A6785; }
#pw .pc.gray small { color: #5A6785; }
#pw .pc.em { border: 2px dashed #CBD5E8; background: transparent; }
#pw .pc.on { box-shadow: 0 0 0 3px #14213D; }
#pw .pc[disabled] { cursor: default; }
#pw .st { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 16px; line-height: 1.4; background: #fff; border: 1px solid #CBD5E8; }
#pw .st.ok { background: #DDF3E6; color: #14562F; border-color: transparent; }
#pw .st small { font-weight: 400; font-size: 14px; color: #5A6785; }
#pw .tg { height: 64px; background: #fff; border: 1px solid #CBD5E8; border-radius: 14px; padding: 0 16px; display: flex; align-items: center; gap: 16px; }
#pw .tg b { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 44px; line-height: 1.1; }
#pw .tg span { font-size: 14px; line-height: 1.35; color: #5A6785; }
#pw .pv { height: 52px; background: #fff; border: 2px solid #CBD5E8; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 600; font-size: 26px; overflow: hidden; }
#pw .pv.long { font-size: 18px; }
#pw .slot { height: 32px; display: flex; align-items: center; font-size: 14px; line-height: 1.35; color: #5A6785; flex: none; overflow: hidden; }
#pw .slot.err { color: #B3261E; font-weight: 700; }
#pw .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 136px; align-content: start; }
#pw .it { height: 64px; border-radius: 12px; border: 2px solid #CBD5E8; background: #fff; color: #14213D; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 30px; padding: 0 4px; overflow: hidden; }
#pw .it.long { font-size: 18px; }
#pw .it.ph { border-style: dashed; background: transparent; }
#pw .it.on { background: #4B35C9; border-color: #4B35C9; color: #fff; }
#pw .ops { display: flex; gap: 8px; }
#pw .op { flex: 1; height: 56px; border-radius: 10px; border: 1px solid #CBD5E8; background: #fff; color: #14213D; display: flex; align-items: center; justify-content: center; padding: 0; }
#pw .op.on { background: #4B35C9; border-color: #4B35C9; color: #fff; }
#pw .op[disabled] { opacity: .35; }
#pw .op svg { width: 30px; height: 30px; display: block; pointer-events: none; }
#pw .op .xn { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 27px; line-height: 1; pointer-events: none; }
#pw .gh { flex: 1; height: 44px; border-radius: 10px; border: 1px solid #CBD5E8; background: transparent; color: #14213D; font-size: 16px; }
#pw .gh[disabled] { opacity: .4; }
#pw .good { padding: 22px 18px; border-radius: 16px; background: #DDF3E6; color: #14562F; display: flex; flex-direction: column; gap: 12px; }
#pw .good .t1 { display: flex; align-items: center; gap: 12px; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 24px; line-height: 1.3; }
#pw .good .eq { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 600; font-size: 30px; line-height: 1.3; color: #14213D; word-break: break-word; }
#pw .box { background: #fff; border: 1px solid #CBD5E8; border-radius: 16px; padding: 16px 18px; }
#pw .box h2 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 22px; margin: 0 0 4px; line-height: 1.3; }
#pw .muted { color: #5A6785; }
#pw .big { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 56px; line-height: 1.2; display: flex; align-items: baseline; gap: 10px; }
#pw .big.pos { color: #14562F; } #pw .big.neg { color: #B3261E; }
#pw .br { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid #CBD5E8; }
#pw .br .p { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 22px; white-space: nowrap; }
#pw .br .p.pos { color: #14562F; } #pw .br .p.neg { color: #B3261E; }
#pw .tr { display: flex; align-items: center; gap: 10px; padding: 4px 6px; font-size: 17px; line-height: 1.4; border-radius: 8px; }
#pw .tr.me { background: #EDF1F9; }
#pw .tr b { font-family: Prompt, "Noto Sans Thai", sans-serif; }
#pw .fl { display: block; font-size: 15px; line-height: 1.4; font-weight: 700; margin-bottom: 6px; }
#pw .in { width: 100%; min-height: 52px; padding: 6px 14px; border-radius: 12px; border: 2px solid #CBD5E8; background: #fff; color: #14213D; font: inherit; font-size: 20px; }
#pw .go { min-height: 56px; border-radius: 14px; border: 0; background: #4B35C9; color: #fff; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 20px; }
#pw .go[disabled] { opacity: .5; }
#pw .errm { padding: 8px 12px; border-radius: 10px; background: #FBE3E1; color: #B3261E; }
/* ---- join screen: ticket + keypad ---- */
#pw.jn { background: #0E1326; color: #EEF1FA; gap: 14px; padding: 28px 16px 20px; }
#pw.jn .jh { text-align: center; }
#pw.jn .jh .t { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 34px; line-height: 1.25; }
#pw.jn .jh .s { color: #B4BEDA; font-size: 15px; }
#pw.jn .tk { background: #FFD84D; color: #14213D; border: 2px solid #EEF1FA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
#pw.jn .tk .fl { margin: 0; }
#pw.jn .jcd { display: flex; gap: 8px; }
#pw.jn .ct { flex: 1; height: 56px; border-radius: 10px; border: 2px dashed #14213D; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 30px; line-height: 1; }
#pw.jn .ct.f { background: #14213D; border-style: solid; color: #FFD84D; }
#pw.jn .ct.n { border-style: solid; background: #FFF3B8; }
#pw.jn .dv { margin: 2px -14px; border-top: 2px dashed #14213D; position: relative; }
#pw.jn .dv::before, #pw.jn .dv::after { content: ""; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%; background: #0E1326; border: 2px solid #EEF1FA; box-sizing: border-box; }
#pw.jn .dv::before { left: -11px; } #pw.jn .dv::after { right: -11px; }
#pw.jn .tk .in { border-color: #14213D; }
#pw.jn .tk .go { background: #14213D; color: #FFD84D; }
#pw.jn .kp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#pw.jn .kp button { height: 52px; border-radius: 12px; border: 2px solid #5A6785; background: #171F3D; color: #EEF1FA; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 24px; line-height: 1; }
#pw.jn .kp button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#pw.jn .kp button:active { background: #2B3560; }
#pw.jn .kp button.bk { border-color: #FFD84D; color: #FFD84D; font-size: 20px; }
#pw.jn .kp button.cl { color: #B4BEDA; font-size: 17px; }
#pw.jn .jtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#pw.jn .jedit { background: none; border: 0; padding: 4px 0; color: #14213D; font-weight: 700; font-size: 15px; text-decoration: underline; }
#pw.jn .jn-note { text-align: center; color: #B4BEDA; font-size: 14px; }

/* ---- host animations (projector only; skipped when the device asks for reduced motion) ---- */
@keyframes fxPop { 0% { transform: scale(.55); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes fxShake { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-4px) rotate(-1.5deg); } 75% { transform: translateY(4px) rotate(1.5deg); } }
@keyframes fxFall { 0% { transform: translate3d(0, -60px, 0) rotate(0); opacity: 1; } 100% { transform: translate3d(var(--dx), 1180px, 0) rotate(var(--rot)); opacity: .9; } }
@keyframes fxGlow { 0%, 100% { box-shadow: 0 0 0 rgba(255, 214, 90, 0); } 50% { box-shadow: 0 0 36px rgba(255, 214, 90, .75); } }
.rolling { color: #FFD65A; animation: fxShake .18s infinite; }
.fxpop { animation: fxPop .45s ease-out; }
.cf { position: absolute; top: 0; width: 18px; height: 28px; border-radius: 4px; z-index: 30; pointer-events: none; animation: fxFall var(--dur) cubic-bezier(.2, .6, .4, 1) forwards; }
.lr.crowned { animation: fxGlow 1.4s ease-in-out 3; border-radius: 16px; }
.bar2 div { transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/*LOGIC-START*/
/* ---------- exact rational arithmetic (BigInt) ---------- */
function bgcd(a, b) { if (a < 0n) a = -a; if (b < 0n) b = -b; while (b) { var t = a % b; a = b; b = t; } return a; }
function frac(n, d) {
  if (d === undefined) d = 1n;
  if (d === 0n) throw { msg: "หารด้วยศูนย์" };
  if (d < 0n) { n = -n; d = -d; }
  var g = bgcd(n, d); if (g === 0n) g = 1n;
  return { n: n / g, d: d / g };
}
/* every intermediate value (numerator and denominator, reduced) must stay within one million, same rule as the solver below */
var LIMIT = 1000000n;
function guard(v) { var a = v.n < 0n ? -v.n : v.n; if (a > LIMIT || v.d > LIMIT) throw { msg: "ค่าระหว่างทางมากเกินไป (เกินหนึ่งล้าน)" }; return v; }
function fadd(a, b) { return guard(frac(a.n * b.d + b.n * a.d, a.d * b.d)); }
function fsub(a, b) { return guard(frac(a.n * b.d - b.n * a.d, a.d * b.d)); }
function fmul(a, b) { return guard(frac(a.n * b.n, a.d * b.d)); }
function fdiv(a, b) { if (b.n === 0n) throw { msg: "หารด้วยศูนย์" }; return guard(frac(a.n * b.d, a.d * b.n)); }
function fpow(a, e) {
  if (e.d !== 1n) throw { msg: "เลขชี้กำลังต้องเป็นจำนวนเต็ม" };
  if (e.n < 0n) throw { msg: "เลขชี้กำลังต้องไม่ติดลบ" };
  if (e.n > 40n) throw { msg: "เลขชี้กำลังมากเกินไป (เกิน 40)" };
  if (a.n === 0n && e.n === 0n) throw { msg: "0 ยกกำลัง 0 ไม่นิยาม" };
  var abs = a.n < 0n ? -a.n : a.n;
  if (abs > 1n && abs.toString(2).length * Number(e.n) > 4000) throw { msg: "ค่ามากเกินไป" };
  return guard(frac(a.n ** e.n, a.d ** e.n));
}
function fstr(v) { return v.d === 1n ? v.n.toString() : v.n.toString() + "/" + v.d.toString(); }

/* tokens: {k:"n", i:<index of starting number>, v:<value>} | {k:"o", v:"+"|"−"|"×"|"÷"|"^"|"("|")"} */
function evaluate(tokens) {
  var pos = 0;
  function peek() { return tokens[pos]; }
  function isOp(t, vals) { return t && t.k === "o" && vals.indexOf(t.v) >= 0; }
  function expr() {
    var v = term();
    while (isOp(peek(), ["+", "−"])) { var o = tokens[pos++].v; var r = term(); v = o === "+" ? fadd(v, r) : fsub(v, r); }
    return v;
  }
  function term() {
    var v = power();
    while (isOp(peek(), ["×", "÷"])) { var o = tokens[pos++].v; var r = power(); v = o === "×" ? fmul(v, r) : fdiv(v, r); }
    return v;
  }
  function power() {
    var b = atom();
    if (isOp(peek(), ["^"])) { pos++; var e = power(); return fpow(b, e); }
    return b;
  }
  function atom() {
    var t = peek();
    if (!t) throw { msg: "สมการไม่สมบูรณ์" };
    if (t.k === "n") { pos++; return frac(BigInt(t.v)); }
    if (isOp(t, ["("])) {
      pos++; var v = expr();
      if (!isOp(peek(), [")"])) throw { msg: "วงเล็บไม่ครบคู่" };
      pos++; return v;
    }
    throw { msg: "รูปแบบสมการไม่ถูกต้อง" };
  }
  var v = expr();
  if (pos < tokens.length) throw { msg: "รูปแบบสมการไม่ถูกต้อง" };
  return v;
}

/* Check one submitted equation: uses starting numbers at most once each, at least 2 of them, result must equal target */
function checkEquation(tokens, nums, target) {
  if (!tokens || !tokens.length) return { pass: false, reason: "ไขไม่ทันเวลา" };
  var seen = {}, count = 0, i;
  for (i = 0; i < tokens.length; i++) {
    var t = tokens[i];
    if (t.k === "n") {
      if (seen[t.i] || nums[t.i] !== t.v) return { pass: false, reason: "ใช้เลขตั้งต้นไม่ถูกต้อง" };
      seen[t.i] = true; count++;
    }
  }
  if (count < 2) return { pass: false, reason: "ต้องใช้เลขตั้งต้นอย่างน้อย 2 ตัว" };
  var v;
  try { v = evaluate(tokens); }
  catch (e) { if (e && e.msg) return { pass: false, reason: e.msg }; throw e; }
  var pass = v.d === 1n && v.n === BigInt(target);
  return { pass: pass, value: fstr(v), reason: pass ? "" : "ผลลัพธ์ไม่เท่ากับค่าช่อง" };
}

/* ---------- board generation ---------- */
/* Difficulty of a result = how often it can be built from 4 random starting numbers.
   DEFAULT_COUNTS[t-1] = number of draws (out of 5,400 possible draws with the default ranges 1-5, 1-10, 1-12, 1-15)
   from which result t (1..400) can be built with + − × ÷ ^ and parentheses, each number at most once, at least 2 numbers used,
   every intermediate value within one million, exponent 0..40.
   Results 1..M are ranked from hardest to easiest and cut into 5 tiers with fixed shares (16% / 26.5% / 21% / 19% / 17.5%);
   for M = 200 this reproduces the earlier fixed table exactly. Tier 1 = apex (hardest) … tier 5 = base (easiest). */
var DEFAULT_RANGES = [[1, 5], [1, 10], [1, 12], [1, 15]];
var DEFAULT_COUNTS = "5400,5400,5398,5395,5390,5397,5398,5396,5394,5393,5378,5373,5375,5385,5352,5374,5317,5307,5256,5319,5226,5129,5039,5326,5156,4987,4949,5101,4729,4987,4542,5082,4756,4417,4853,5254,4110,4222,4488,5084,4028,4663,3885,4612,4794,3909,3578,4924,4638,4403,3869,4063,3572,4622,4297,4469,3691,3519,3533,4918,3197,3321,4483,5193,3869,3987,3095,3432,3483,4388,3124,4692,2958,3173,3859,3441,3635,3604,2645,4497,4805,2799,2295,4176,2993,2656,2551,3616,2374,4154,3038,2566,2356,2089,2413,4096,1783,2593,3157,4074,1801,2297,1808,2897,2904,1755,1566,3811,1680,2917,1659,3283,1709,2422,2004,2144,2853,1948,2174,4124,3446,1733,1862,2145,4091,3452,1831,4124,2011,2529,1685,2963,1916,1695,2671,2089,1383,1801,1294,2861,1284,1003,1945,4104,1306,900,1587,1106,880,2375,809,1489,1454,1887,949,1890,632,681,813,2457,981,2198,636,836,1759,697,557,2562,2272,1382,1120,852,597,931,1184,1689,629,506,529,2950,554,1238,504,966,623,702,889,677,1219,1078,521,2580,500,351,1260,2454,467,1394,512,1958,644,501,611,1265,656,661,927,1368,884,1876,660,730,500,644,790,3835,794,674,479,1632,1003,658,520,1858,2607,711,467,1212,613,1011,1095,896,660,1260,789,764,667,789,697,2185,769,1120,3710,985,1334,845,1115,753,962,1963,995,2295,1144,697,1288,4412,815,711,773,1259,855,544,495,1300,645,801,446,511,269,1442,289,460,454,181,650,602,132,154,401,1291,141,291,189,263,543,487,234,1837,1148,482,203,304,194,750,293,366,588,146,260,1544,203,78,162,379,182,426,183,686,185,367,196,881,192,180,897,275,181,288,379,1861,254,282,275,2321,490,139,278,427,366,1018,326,380,568,401,449,1099,369,552,497,534,521,712,2862,579,592,197,451,718,348,815,658,965,388,384,416,309,369,237,179,1881,991,191,503,549,271,202,146,298,242,345,183,359,103,183,687,206,118,652,108,396,125,70,136,1673,477,85,265,174,129,662,167,761,196,145,239,931,179,94,283,1809".split(",").map(Number);
var TIER_CUM = [0.16, 0.425, 0.635, 0.825, 1];
var TIER_SCORE = { 1: [10, 12], 2: [8, 9], 3: [6, 7], 4: [4, 5], 5: [2, 3] };
function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rint(0, i); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ---- solver: finds, for every result 1..maxV, an expression with the fewest operations (or none) ---- */
var NLIM = 1000000;
function ngcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
function nfr(n, d) { if (d < 0) { n = -n; d = -d; } var g = ngcd(n, d) || 1; return [n / g, d / g]; }
function nok(v) { return Math.abs(v[0]) <= NLIM && v[1] <= NLIM; }
function npowInt(b, e) { var r = 1; for (var i = 0; i < e; i++) { r *= b; if (Math.abs(r) > NLIM) return null; } return r; }
function npow(x, y) {
  if (y[1] !== 1 || y[0] < 0 || y[0] > 40) return null;
  var e = y[0];
  if (x[0] === 0 && e === 0) return null;
  if (e === 0) return [1, 1];
  var n = npowInt(x[0], e), d = npowInt(x[1], e);
  if (n === null || d === null) return null;
  return nfr(n, d);
}
function solveAll(nums, maxV) {
  var vals = new Array(16);
  for (var m = 1; m < 16; m++) {
    var mp = new Map();
    var put = function (r, node) { var k = r[0] + "/" + r[1]; var cur = mp.get(k); if (!cur || node.ops < cur.node.ops) mp.set(k, { v: r, node: node }); };
    var bits = [0, 1, 2, 3].filter(function (i) { return (m >> i) & 1; });
    if (bits.length === 1) { put([nums[bits[0]], 1], { leaf: true, i: bits[0], v: nums[bits[0]], ops: 0 }); vals[m] = mp; continue; }
    for (var a = (m - 1) & m; a > 0; a = (a - 1) & m) {
      var b = m ^ a;
      vals[a].forEach(function (X) { vals[b].forEach(function (Y) {
        var x = X.v, y = Y.v, r, ops = X.node.ops + Y.node.ops + 1;
        var nd = function (op) { return { op: op, l: X.node, r: Y.node, ops: ops }; };
        if (a < b) {
          r = nfr(x[0] * y[1] + y[0] * x[1], x[1] * y[1]); if (nok(r)) put(r, nd("+"));
          r = nfr(x[0] * y[0], x[1] * y[1]); if (nok(r)) put(r, nd("×"));
        }
        r = nfr(x[0] * y[1] - y[0] * x[1], x[1] * y[1]); if (nok(r)) put(r, nd("−"));
        if (y[0] !== 0) { r = nfr(x[0] * y[1], x[1] * y[0]); if (nok(r)) put(r, nd("÷")); }
        r = npow(x, y); if (r && nok(r)) put(r, nd("^"));
      }); });
    }
    vals[m] = mp;
  }
  var best = {};
  for (var m2 = 1; m2 < 16; m2++) {
    if ((m2 & (m2 - 1)) === 0) continue;
    vals[m2].forEach(function (e) {
      if (e.v[1] === 1 && e.v[0] >= 1 && e.v[0] <= maxV) { var t = e.v[0]; if (!best[t] || e.node.ops < best[t].ops) best[t] = e.node; }
    });
  }
  return best;
}

/* ---- expression trees → tokens (for the checker) and HTML (superscript exponents) ---- */
var PREC = { "+": 1, "−": 1, "×": 2, "÷": 2, "^": 3 };
function needParen(t, pp, side, pop, html) {
  if (t.leaf || pp === undefined) return false;
  if (pop === "^") return side === "l" ? true : (html ? false : t.op !== "^");
  var p = PREC[t.op];
  return p < pp || (p === pp && side === "r" && (pop === "−" || pop === "÷"));
}
function treeTokens(t, pp, side, pop) {
  if (t.leaf) return [{ k: "n", i: t.i, v: t.v }];
  var inner = treeTokens(t.l, PREC[t.op], "l", t.op).concat([{ k: "o", v: t.op }], treeTokens(t.r, PREC[t.op], "r", t.op));
  return needParen(t, pp, side, pop, false) ? [{ k: "o", v: "(" }].concat(inner, [{ k: "o", v: ")" }]) : inner;
}
function treeHtml(t, pp, side, pop) {
  if (t.leaf) return String(t.v);
  var inner = t.op === "^"
    ? treeHtml(t.l, 3, "l", "^") + "<sup>" + treeHtml(t.r, 3, "r", "^") + "</sup>"
    : treeHtml(t.l, PREC[t.op], "l", t.op) + " " + t.op + " " + treeHtml(t.r, PREC[t.op], "r", t.op);
  return needParen(t, pp, side, pop, true) ? "(" + inner + ")" : inner;
}

/* ---- tiers ---- */
function poolsFromReach(reach, M) {
  var vals = []; for (var t = 1; t <= M; t++) vals.push(t);
  vals.sort(function (x, y) { return (reach(x) - reach(y)) || (y - x); });   // hardest first; on a tie the larger value counts as harder
  var pools = { 1: [], 2: [], 3: [], 4: [], 5: [] }, lo = 0;
  for (var k = 1; k <= 5; k++) { var hi = Math.round(TIER_CUM[k - 1] * M); pools[k] = vals.slice(lo, hi); lo = hi; }
  return pools;
}
function sameRanges(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function estimateReach(ranges, M) {
  var N = 240, cnt = new Array(M + 1).fill(0);
  for (var s = 0; s < N; s++) { var best = solveAll(genNums(ranges), M); for (var t = 1; t <= M; t++) if (best[t]) cnt[t]++; }
  return function (t) { return cnt[t]; };
}
function buildPools(ranges, M) {
  if (sameRanges(ranges, DEFAULT_RANGES)) return poolsFromReach(function (t) { return DEFAULT_COUNTS[t - 1]; }, M);
  return poolsFromReach(estimateReach(ranges, M), M);
}
var DEFAULT_POOLS = buildPools(DEFAULT_RANGES, 200);
/* reach = result of solveAll for this round's starting numbers. With it, every cell value is one that can really be built from those numbers:
   each tier draws from its own difficulty pool first; if the pool has too few buildable values it borrows the nearest tier's. Without reach (or if fewer than 15 buildable values exist) the old pure-pool draw is used. */
function genBoard(pools, reach) {
  pools = pools || DEFAULT_POOLS;
  var cells = [], id = 0, used = {};
  for (var tier = 1; tier <= 5; tier++) {
    var vals;
    if (reach) {
      vals = [];
      for (var d = 0; d <= 4 && vals.length < tier; d++) {
        [tier - d, tier + d].filter(function (k, i, a) { return k >= 1 && k <= 5 && a.indexOf(k) === i; }).forEach(function (k) {
          if (vals.length >= tier) return;
          var cand = shuffle(pools[k].filter(function (v) { return reach[v] && !used[v]; }));
          while (cand.length && vals.length < tier) { var v = cand.pop(); used[v] = 1; vals.push(v); }
        });
      }
      if (vals.length < tier) {   /* not enough buildable values anywhere: top up from the plain pool */
        var rest = shuffle(pools[tier].filter(function (v) { return !used[v]; }));
        while (rest.length && vals.length < tier) { var w = rest.pop(); used[w] = 1; vals.push(w); }
      }
      vals.sort(function (x, y) { return x - y; });
    } else vals = shuffle(pools[tier]).slice(0, tier).sort(function (x, y) { return x - y; });
    for (var k = 0; k < vals.length; k++) {
      cells.push({ id: id++, tier: tier, col: k, value: vals[k], score: rint(TIER_SCORE[tier][0], TIER_SCORE[tier][1]) });
    }
  }
  return cells;
}
/* ranges: [[lo,hi] x 4] — number i is drawn from ranges[i]; the 4 numbers are all different */
function rangesFeasible(ranges) {
  var ok = ranges.every(function (r) { return Number.isInteger(r[0]) && Number.isInteger(r[1]) && r[0] >= 1 && r[0] <= r[1]; });
  if (!ok) return false;
  var used = {};
  var order = ranges.slice().sort(function (a, b) { return a[1] - b[1]; });
  for (var i = 0; i < order.length; i++) {
    var v = order[i][0];
    while (used[v]) v++;
    if (v > order[i][1]) return false;
    used[v] = true;
  }
  return true;
}
function genNums(ranges) {
  for (var t = 0; t < 2000; t++) {
    var n = ranges.map(function (r) { return rint(r[0], r[1]); });
    if (new Set(n).size === n.length) return n;
  }
  /* fallback for very tight ranges: fill the tightest slots first */
  var idx = ranges.map(function (_, i) { return i; }).sort(function (a, b) { return ranges[a][1] - ranges[b][1]; });
  var out = [], used = {};
  idx.forEach(function (i) { var v = ranges[i][0]; while (used[v]) v++; used[v] = true; out[i] = v; });
  return out;
}

/* ---------- scoring ---------- */
/* res: {playerId: cellId}; chal: {targetId: [challengerIds]}; pass: {targetId: bool} */
function scoreBreakdown(res, chal, pass, cells, cfg) {
  var own = {}, challenge = {};
  function addOwn(p, v) { own[p] = (own[p] || 0) + v; }
  function addCh(p, v) { challenge[p] = (challenge[p] || 0) + v; }
  Object.keys(res).forEach(function (tid) {
    var c = cells[res[tid]];
    var chs = chal[tid] || [];
    if (!chs.length) { addOwn(tid, c.score); return; }
    if (pass[tid]) {
      addOwn(tid, Math.min(chs.length, cfg.maxMult) * c.score);
      chs.forEach(function (x) { addCh(x, -c.score); });
    } else {
      addOwn(tid, -(cfg.penalty === "count" ? chs.length : 1) * c.score);
      chs.forEach(function (x) { addCh(x, c.score); });
    }
  });
  return { own: own, challenge: challenge };
}
function scoreRound(res, chal, pass, cells, cfg) {
  var b = scoreBreakdown(res, chal, pass, cells, cfg), delta = {};
  [b.own, b.challenge].forEach(function (m) { Object.keys(m).forEach(function (p) { delta[p] = (delta[p] || 0) + m[p]; }); });
  return delta;
}
function clampScore(v, floor) { return floor === null || floor === undefined ? v : Math.max(floor, v); }
/* ---------- step-by-step input (method C) ---------- */
function opApply(op, a, b) {
  return op === "+" ? fadd(a, b) : op === "−" ? fsub(a, b) : op === "×" ? fmul(a, b) : op === "÷" ? fdiv(a, b) : fpow(a, b);
}
function leafItems(nums) {
  return nums.map(function (v, i) { return { id: "s" + i, f: frac(BigInt(v)), node: { leaf: true, i: i, v: v }, used: 1 }; });
}
function newWork(nums) { return { items: leafItems(nums), hist: [], a: null, op: null, err: "", last: "", n: 0 }; }
/* combine items a and b with op → returns {work changes applied, solved:bool} ; throws {msg} when the step is not allowed */
function workCombine(w, idB, target) {
  var A = w.items.filter(function (x) { return x.id === w.a; })[0], B = w.items.filter(function (x) { return x.id === idB; })[0];
  var f = opApply(w.op, A.f, B.f);
  var it = { id: "m" + (++w.n), f: f, node: { op: w.op, l: A.node, r: B.node }, used: A.used + B.used };
  w.hist.push(w.items.slice());
  w.items = w.items.filter(function (x) { return x.id !== A.id && x.id !== B.id; }).concat([it]);
  w.last = treeHtml(it.node) + " = " + fstr(f);
  w.a = null; w.op = null; w.err = "";
  return it.used >= 2 && f.d === 1n && f.n === BigInt(target) ? it : null;
}
/*LOGIC-END*/

/* ============================================================ shared helpers ============================================================ */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
function fmtN(n) { return n < 0 ? "−" + (-n) : String(n); }
function rid() { return Math.random().toString(36).slice(2, 10); }

/* ---------- transport ----------
   Net.open(code, me, onmsg) / Net.send(msg) / Net.close()
   Uses a Supabase Realtime "broadcast" channel named "calcu-<code>" (no database tables needed).
   If the Supabase library cannot be loaded, or the channel cannot connect within 5 s, it falls back to
   BroadcastChannel (tabs of the same browser only) so the page still works as a single-computer test.
   Net.mode is "supabase" or "local"; the small badge #netb shows which one is active. */
var SB = { url: "https://pmiwrnbpoumkpmbbylvw.supabase.co", key: "sb_publishable_XhPC1F8vvNzOt7KoaEaQKw_C_0pJksR" };
var Net = {
  ch: null, me: null, mode: "", ready: false, q: [], client: null, timer: null, code: "", onmsg: null,
  setStatus: function (st) {
    var b = document.getElementById("netb"); if (!b) return;
    b.className = st;
    b.textContent = st === "ok" ? "เชื่อมต่อ Supabase แล้ว" : st === "local" ? "โหมดทดสอบ: ใช้ได้เฉพาะแท็บในเบราว์เซอร์เดียวกัน" : st === "bad" ? "ขาดการเชื่อมต่อ กำลังลองใหม่" : "กำลังเชื่อมต่อ…";
    b.title = b.textContent;
  },
  open: function (code, me, onmsg) {
    this.close(); this.me = me; this.code = code; this.onmsg = onmsg; this.q = []; this.ready = false;
    var self = this;
    if (window.supabase && window.supabase.createClient) {
      try {

  var st = P.st, d = m.delta || 0, rows = st.rows, i = rows.map(function (r) { return r.pid; }).indexOf(P.pid), top3 = rows.slice(0, 3);
  if (i >= 3) top3 = rows.slice(0, 2).concat([rows[i]]);
  var lines = (m.lines || []).filter(function (l) { return !(l.d === 0 && !l.sub); }).map(function (l) { return '<div class="br"><span>' + esc(l.label) + (l.sub ? '<br><span class="muted" style="font-size:14px">' + l.sub + "</span>" : "") + '</span><span class="p ' + (l.d > 0 ? "pos" : l.d < 0 ? "neg" : "") + '">' + (l.d > 0 ? "+" : l.d < 0 ? "−" : "") + Math.abs(l.d) + "</span></div>"; }).join("");
  return (endMode ? "" : '<div class="box" style="padding-bottom:4px"><div class="muted" style="font-size:14px">คะแนนที่เปลี่ยนในรอบนี้</div><div class="big ' + (d > 0 ? "pos" : d < 0 ? "neg" : "") + '"><span style="font-size:30px">' + (d > 0 ? "▲" : d < 0 ? "▼" : "") + "</span>" + (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d) + "</div>" + lines + "</div>") +
    '<div class="box" style="padding:12px 16px"><div style="display:flex;align-items:baseline;justify-content:space-between"><span class="hd" style="font-weight:700;font-size:20px">คะแนนรวม ' + fmtN(m.score) + '</span><span class="muted">อันดับ ' + m.rank + " จาก " + rows.length + " · เป้า " + st.target + "</span></div>" +
    top3.map(function (r) { var rk = rows.filter(function (x) { return x.score > r.score; }).length + 1; return '<div class="tr' + (r.pid === P.pid ? " me" : "") + '"><span style="width:20px" class="muted">' + rk + '</span><b style="flex:1">' + esc(r.name) + (r.pid === P.pid ? " (คุณ)" : "") + "</b><b>" + fmtN(r.score) + "</b></div>"; }).join("") + "</div>";
}
function renderPlayer() {
  if (!P.joined || !P.st) return;
  document.getElementById("app").innerHTML = viewGameP();
}
function onPlayerMsg(m) {
  if (!m) return;
  if (m.type === "reject" && m.to === P.pid) { P.error = m.reason; P.joining = false; P.joined = false; Net.close(); ss("calcu-joined", "0"); PL.clear(); renderPlayerForce(); return; }
  if (m.type === "adopt" && m.to === P.pid) { P.pid = m.pid; ss("calcu-pid", P.pid); Net.send({ type: "join", pid: P.pid, name: P.name }); return; }
  if (m.type !== "state") return;
  if (!m.me || !m.me[P.pid]) { if (!P.joined) return; }
  P.st = m; P.recvAt = Date.now();
  if (P.sent && P.sentAt && Date.now() - P.sentAt > 2500 && !(m.me[P.pid] && m.me[P.pid].solved)) P.sent = false;
  if (m.me && m.me[P.pid] && !P.joined) { P.joined = true; P.joining = false; P.error = ""; ss("calcu-name", P.name); ss("calcu-code", P.code); ss("calcu-joined", "1"); PL.write(); }
  renderPlayer();
}
function pjoin() {
  var code = document.getElementById("code").value.trim(), name = document.getElementById("nick").value.trim();
  P.code = code; P.name = name;
  if (!/^\d{4}$/.test(code)) { P.error = "รหัสห้องมี 4 หลัก"; JSTEP = 1; renderPlayerForce(); return; }
  if (!name) { P.error = "กรอกชื่อเล่นก่อน"; renderPlayerForce(); return; }
  P.error = ""; P.joining = true; renderPlayerForce();
  Net.open(code, P.pid, onPlayerMsg);
  Net.send({ type: "join", pid: P.pid, name: name });
  setTimeout(function () { if (!P.joined && P.joining) { P.joining = false; P.error = "ไม่พบห้องนี้ ตรวจรหัสห้องและให้แน่ใจว่าเปิดหน้า Host ไว้แล้ว"; JSTEP = 1; Net.close(); ss("calcu-joined", "0"); PL.clear(); renderPlayerForce(); } }, 8000);
}
function renderPlayerForce() { var app2 = document.getElementById("app"); app2.innerHTML = viewJoin(); }
function setJoinCode(v) {
  v = String(v).replace(/\D/g, "").slice(0, 4); P.code = v; P.error = "";
  var c = document.getElementById("code"); if (c) c.value = v;
  var t = document.querySelectorAll("#cdisp .ct");
  for (var i = 0; i < t.length; i++) { t[i].textContent = v[i] || ""; t[i].className = "ct" + (v[i] ? " f" : (i === v.length ? " n" : "")); }
  var e = document.querySelector("#pw.jn .errm"); if (e) e.remove();
  if (v.length === 4 && JSTEP === 1) setTimeout(function () { if (JSTEP === 1 && joinCode().length === 4 && document.getElementById("cdisp")) { JSTEP = 2; renderPlayerForce(); var n = document.getElementById("nick"); if (n && !n.value) n.focus(); } }, 250);
}
function joinCode() { var c = document.getElementById("code"); return c ? c.value : ""; }
var PACT = {
  join: pjoin,
  key: function (b) { var v = joinCode(); setJoinCode(v.length < 4 ? v + b.dataset.k : b.dataset.k); },
  del: function () { setJoinCode(joinCode().slice(0, -1)); },
  clr: function () { setJoinCode(""); },
  editcode: function () { var n = document.getElementById("nick"); if (n) P.name = n.value.trim(); JSTEP = 1; renderPlayerForce(); },
  leave: function () { P.code = ""; JSTEP = 1; P.joined = false; P.st = null; Net.close(); ss("calcu-joined", "0"); PL.clear(); renderPlayerForce(); },
  pick: function (b) { Net.send({ type: "pick", pid: P.pid, cell: Number(b.dataset.id) }); },
  chal: function (b) { Net.send({ type: "chal", pid: P.pid, target: b.dataset.id }); },
  pickItem: function (b) {
    var m = me(); if (!m || !m.challenged || m.solved || P.sent) return;
    var w = getWork(), id = b.dataset.id; w.err = "";
    if (w.a === null) w.a = id;
    else if (w.a === id) { w.a = null; w.op = null; }
    else if (w.op === null) w.a = id;
    else {
      var hit;
      var aId = w.a;
      try { hit = workCombine(w, id, m.challenged.value); } catch (e) { if (e && e.msg) { w.err = e.msg; w.a = null; w.op = null; renderPlayer(); return; } throw e; }
      w.shist.push(w.slots.slice()); var ia = w.slots.indexOf(aId), ib = w.slots.indexOf(id); w.slots[ia] = w.items[w.items.length - 1].id; w.slots[ib] = null;
      if (hit) { P.sent = true; P.sentAt = Date.now(); Net.send({ type: "submit", pid: P.pid, node: hit.node }); }
    }
    renderPlayer();
  },
  pickOp: function (b) { var m = me(); if (!m || !m.challenged || m.solved || P.sent) return; var w = getWork(); if (!w.a) return; w.err = ""; w.op = w.op === b.dataset.o ? null : b.dataset.o; renderPlayer(); },
  undo: function () { var w = getWork(); if (P.sent || !w.hist.length) return; w.items = w.hist.pop(); if (w.shist.length) w.slots = w.shist.pop(); w.a = null; w.op = null; w.err = ""; w.last = ""; renderPlayer(); },
  reset: function () { if (P.sent) return; P.work = freshWork(P.st.nums); renderPlayer(); }
};
function playerBoot() {
  MODE = "player"; document.body.className = "ph"; ss("calcu-role", "player");
  document.getElementById("app").innerHTML = viewJoin();
  document.getElementById("app").addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
    if (PACT[b.dataset.a]) PACT[b.dataset.a](b);
  });
  document.addEventListener("keydown", function (e) {
    var a = document.activeElement; if (JSTEP !== 1 || !document.getElementById("cdisp") || (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^\d$/.test(e.key)) { if (joinCode().length < 4) setJoinCode(joinCode() + e.key); } else if (e.key === "Backspace") setJoinCode(joinCode().slice(0, -1));
  });
  setInterval(function () { var t = document.getElementById("tm"); if (t && P.st) { var l = pLeft(); t.textContent = l === null ? "–" : Math.ceil(l / 1000); } }, 250);
  /* a player who reloads the page rejoins the same room with the same id */
  setInterval(function () { if (P.joined) PL.write(); }, 2000);
  if (ss("calcu-joined") !== "1") {   /* tab was closed and reopened: take over the identity of a tab that is no longer sending its heartbeat */
    var old = PL.read();
    if (old && old.pid && old.name && /^\d{4}$/.test(old.code || "") && Date.now() - old.t > 6000 && Date.now() - old.t < 8 * 3600 * 1000) {
      P.pid = old.pid; P.name = old.name; P.code = old.code; ss("calcu-pid", P.pid); ss("calcu-name", P.name); ss("calcu-code", P.code); ss("calcu-joined", "1");
    }
  }
  if (P.code && P.name && ss("calcu-joined") === "1") { JSTEP = 2; renderPlayerForce(); document.getElementById("code").value = P.code; document.getElementById("nick").value = P.name; pjoin(); }
  else { P.code = ""; JSTEP = 1; renderPlayerForce(); }
}

/* ============================================================ start ============================================================ */
function roleScreen() {
  document.getElementById("app").innerHTML = '<div class="role"><a href="/games/" style="align-self:flex-start;color:#9C8CFF;font-weight:700;text-decoration:none;padding:8px 0">← กลับเว็บชมรม</a><h1>Calcuเหรอ? <span style="font-size:1rem;color:#B4BEDA">ต้นแบบเรียลไทม์</span></h1><p>เลือกว่าหน้านี้ทำหน้าที่อะไร</p>' +
    '<button class="rbtn pri" data-r="host">Host (จอโปรเจกเตอร์)<small>แสดงกระดานบนจอใหญ่ และเป็นผู้ควบคุมเกม</small></button><button class="rbtn" data-r="player">ผู้เล่น (มือถือ)<small>เข้าห้องด้วยรหัส แล้วเล่นบนมือถือ</small></button>' +
    '<div class="note">ต้นแบบนี้เชื่อมกันได้เฉพาะแท็บในเบราว์เซอร์เดียวกัน เพราะยังไม่ได้ต่อระบบกลาง (Supabase) ลองด้วยการเปิดลิงก์นี้หลายแท็บ: แท็บหนึ่งเป็น Host ที่เหลือเป็นผู้เล่น แท็บผู้เล่นควรย่อหน้าต่างให้แคบเท่ามือถือ</div></div>';
  document.getElementById("app").onclick = function (e) { var b = e.target.closest("[data-r]"); if (!b) return; document.getElementById("app").onclick = null; (b.dataset.r === "host" ? hostBoot : playerBoot)(); };
}
(function () {
  var r = ss("calcu-role");
  if (location.hash === "#host") hostBoot(); else if (location.hash === "#player") playerBoot(); else if (r === "host") hostBoot(); else if (r === "player") playerBoot(); else roleScreen();
})();
</script>
