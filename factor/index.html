#stage .pc .eq { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 32px; line-height: 1.2; white-space: nowrap; }

#stage .pc.good { border-color: #6EDC9A; } #stage .pc.bad { border-color: #FF8A80; } #stage .pc.dec .key { color: #FF8A80; }

.pos { color: #6EDC9A; } .neg { color: #FF8A80; }

<script>
/* ============================================================ GAME LOGIC ============================================================
   Calcu แยกตัวประกอบ: a pyramid of 15 quadratic equations (row 1 = 10 points ... row 5 = 2 points). Some are decoys that cannot be
   factored over the integers. Players reserve one equation, challenge others, and a challenged player must type the factored form
   AND both roots on a keypad (or claim "cannot be factored" on a decoy). Order of the factors and of the roots does not matter:
   the typed product is multiplied out and compared with the equation. Not linked from the club site; not counted for the club. */
var FX_V = 2026112401;   /* page version: RAISE THIS NUMBER EVERY TIME THIS FILE CHANGES (YYYYMMDD + 2 digits) */
var ROW_PTS = [10, 8, 6, 4, 2];
/* decoy patterns, same table as Calcu: [chance %, decoys in the bottom two rows (9 cells), decoys in the top three rows (6 cells)] */
var DECOY_PATTERNS = [[20, 3, 1], [25, 3, 0], [10, 2, 2], [10, 2, 1], [15, 2, 0], [10, 1, 1], [10, 1, 0]];
function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function sgn() { return Math.random() < .5 ? 1 : -1; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
/* fractions {n, d}, d > 0, lowest terms */
function fr(n, d) { if (d === undefined) d = 1; if (d < 0) { n = -n; d = -d; } var g = gcd(n, d); return { n: n / g, d: d / g }; }
function fadd(a, b) { return fr(a.n * b.d + b.n * a.d, a.d * b.d); }
function fmul(a, b) { return fr(a.n * b.n, a.d * b.d); }
function feq(a, b) { return a.n === b.n && a.d === b.d; }
function frText(f) { return (f.n < 0 ? "−" : "") + Math.abs(f.n) + (f.d > 1 ? "/" + f.d : ""); }
/* polynomials: [c0, c1, c2, ...] of fractions */
function pmul(p, q) { var r = []; for (var i = 0; i < p.length + q.length - 1; i++) r.push(fr(0)); for (i = 0; i < p.length; i++) for (var j = 0; j < q.length; j++) r[i + j] = fadd(r[i + j], fmul(p[i], q[j])); return r; }
/* ---------- reading what a student typed ---------- */
function normIn(s) { return String(s == null ? "" : s).replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(/[×*·]/g, "").replace(/X/g, "x"); }
var NUM_RE = /^(\d{1,6})(?:\/(\d{1,6}))?/;
/* "3x-1/2" -> [c0, c1]; null when it is not a linear expression in x */
function parseLinear(s) {
  if (!s) return null;
  var i = 0, p = [fr(0), fr(0)], first = true;
  while (i < s.length) {
    var sg = 1;
    if (s[i] === "+" || s[i] === "-") { sg = s[i] === "-" ? -1 : 1; i++; } else if (!first) return null;
    var m = NUM_RE.exec(s.slice(i)), k = null;
    if (m) { if (m[2] && Number(m[2]) === 0) return null; k = fr(Number(m[1]), m[2] ? Number(m[2]) : 1); i += m[0].length; }
    var hasX = s[i] === "x"; if (hasX) i++;
    if (!k && !hasX) return null;
    if (!k) k = fr(1);
    k = fr(sg * k.n, k.d);
    if (hasX) p[1] = fadd(p[1], k); else p[0] = fadd(p[0], k);
    first = false;
  }
  return p;
}
/* a product of factors written side by side: (x-6)(x+5), x(x+5), (2x-1)(x+3), 2(x+1)(x+2) ... -> { poly, lin = number of factors that contain x } */
function parseFactored(raw) {
  var s = normIn(raw); if (!s || s.length > 40) return null;
  var i = 0, poly = [fr(1)], lin = 0;
  if (s[0] === "-") { poly = [fr(-1)]; i = 1; }
  if (i >= s.length) return null;
  while (i < s.length) {
    var f;
    if (s[i] === "(") { var j = s.indexOf(")", i); if (j < 0) return null; f = parseLinear(s.slice(i + 1, j)); if (!f) return null; i = j + 1; }
    else if (s[i] === "x") { f = [fr(0), fr(1)]; i++; }
    else { var m = NUM_RE.exec(s.slice(i)); if (!m || (m[2] && Number(m[2]) === 0)) return null; f = [fr(Number(m[1]), m[2] ? Number(m[2]) : 1)]; i += m[0].length; }
    if (f.length > 1 && f[1].n !== 0) lin++;
    poly = pmul(poly, f);
  }
  return { poly: poly, lin: lin };
}
/* right factored form = exactly two factors with x, and multiplying them out gives the left side of the equation (any order) */
function checkFactor(e, raw) {
  var r = parseFactored(raw); if (!r || r.lin !== 2) return false;
  var want = [e.c, e.b, e.a];
  for (var i = 0; i < Math.max(3, r.poly.length); i++) { var got = r.poly[i] || fr(0), w = i < 3 ? fr(want[i]) : fr(0); if (!feq(got, w)) return false; }
  return true;
}
function parseRoot(raw) { var s = normIn(raw), m = /^(-?)(\d{1,6})(?:\/(\d{1,6}))?$/.exec(s); if (!m || (m[3] && Number(m[3]) === 0)) return null; return fr((m[1] ? -1 : 1) * Number(m[2]), m[3] ? Number(m[3]) : 1); }
/* both roots, in any order */
function checkRoots(e, r1, r2) {
  if (!e.roots) return false;
  var a = parseRoot(r1), b = parseRoot(r2); if (!a || !b) return false;
  var R = e.roots;
  return (feq(a, R[0]) && feq(b, R[1])) || (feq(a, R[1]) && feq(b, R[0]));
}
/* ---------- making equations ---------- */
function term(k, v, first) { if (k === 0) return ""; var m = Math.abs(k), body = (m === 1 && v ? "" : String(m)) + v; return first ? (k < 0 ? "−" : "") + body : (k < 0 ? " − " : " + ") + body; }
function eqText(e) { return term(e.a, "x²", true) + term(e.b, "x", false) + term(e.c, "", false) + " = 0"; }
function linText(p, q) { /* (px + q) */ var x = (p === 1 ? "" : p) + "x"; return q === 0 ? x : "(" + x + (q < 0 ? " − " : " + ") + Math.abs(q) + ")"; }
function fromRoots(r1, r2) {
  if (r2 === 0) { var t = r1; r1 = r2; r2 = t; }   /* x(x + 5): the bare x first */
  return { a: 1, b: -(r1 + r2), c: r1 * r2, roots: [fr(r1), fr(r2)], key: linText(1, -r1) + linText(1, -r2) };
}
function fromLin(p, q, s) { /* (px + q)(x + s) */ return { a: p, b: p * s + q, c: q * s, roots: [fr(-q, p), fr(-s)], key: linText(p, q) + linText(1, s) }; }
/* tier 1 = top of the pyramid (hardest) ... tier 5 = bottom row (easiest) */
function genReal(tier, aNot1) {
  for (var t = 0; t < 500; t++) {
    var r1, r2, u = Math.random();
    if (tier === 5) { r1 = -rint(1, 6); r2 = -rint(1, 6); }
    else if (tier === 4) { if (u < .6) { r1 = rint(1, 7); r2 = -rint(1, 7); } else if (u < .8) { r1 = rint(2, 9); r2 = -r1; } else { r1 = 0; r2 = sgn() * rint(2, 9); } }
    else if (tier === 3) { if (u < .6) { r1 = rint(2, 9); r2 = rint(2, 9); } else { r1 = rint(3, 10); r2 = -rint(3, 10); } }
    else if (tier === 2) { if (u < .6) { r1 = rint(4, 12); r2 = -rint(4, 12); } else { r1 = rint(5, 12); r2 = rint(5, 12); } if (Math.abs(r1 * r2) < 20) continue; }
    else {
      if (aNot1) { var p = pick([2, 3]), q = sgn() * rint(1, 5), s = sgn() * rint(1, 6); if (gcd(p, q) !== 1) continue; return fromLin(p, q, s); }
      if (u < .7) { r1 = rint(6, 15); r2 = -rint(5, 15); } else { r1 = rint(8, 15); r2 = rint(6, 15); }
      if (Math.abs(r1 * r2) < 40) continue;
    }
    if (r1 === r2) continue;
    return fromRoots(r1, r2);
  }
  return fromRoots(-2, -3);
}
function isSq(n) { if (n < 0) return false; var r = Math.round(Math.sqrt(n)); return r * r === n; }
/* a decoy: looks like the real ones of its row, but b² − 4ac is not a perfect square, so it cannot be factored over the integers */
function genDecoy(tier, aNot1) {
  for (var t = 0; t < 500; t++) {
    var a = 1, b, c;
    if (tier === 5) { b = rint(3, 11); c = rint(2, 30); }
    else if (tier === 4) { if (Math.random() < .7) { b = rint(-6, 6); c = -rint(2, 40); } else { b = 0; c = -rint(2, 60); } }
    else if (tier === 3) { b = -rint(4, 17); c = rint(4, 72); }
    else if (tier === 2) { b = rint(-11, 11); c = -rint(20, 144); }
    else if (aNot1) { a = pick([2, 3]); b = rint(-13, 13); c = sgn() * rint(1, 30); if (b === 0) continue; }
    else { b = rint(-15, 15); c = -rint(40, 225); }
    if (c === 0 || isSq(b * b - 4 * a * c)) continue;
    return { a: a, b: b, c: c, roots: null, decoy: true, key: "" };
  }

    h = topBar("รหัสห้อง " + esc(P.code), "เข้าห้องแล้ว") + '<div class="box"><h2>' + esc(P.name) + '</h2><div class="muted">รอครูกดเริ่มเกม ชื่อของคุณขึ้นบนจอใหญ่แล้ว</div></div>' +
      '<div class="box"><div class="muted" style="font-size:.9rem">ผู้เล่นในห้อง (' + st.players.length + ')</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">' + st.players.map(function (p) { return '<span style="padding:4px 12px;border-radius:99px;border:2px solid #14213D;background:' + pcol(p.idx) + '">' + esc(p.name) + "</span>"; }).join("") + "</div></div>";
  } else if (st.phase === "pick") {
    h = topBar(ra, "จองสมการ", tmHtml()) + '<div class="tip">แตะสมการที่คุณมั่นใจว่าแยกตัวประกอบได้ จองได้ 1 ช่อง (แตะซ้ำเพื่อยกเลิก) บางช่องอาจแยกไม่ได้!</div>' + cellList(st, "pick");
  } else if (st.phase === "chal") {
    var myCh = st.cells.filter(function (c) { return c.ch.indexOf(P.pid) >= 0; }).length;
    h = topBar(ra, "ท้า!", tmHtml()) + '<div class="tip">แตะช่องของเพื่อนที่คิดว่าเขาทำไม่ได้ ท้าได้ ' + st.maxCh + " ช่อง (ท้าแล้ว " + myCh + ") แตะซ้ำเพื่อยกเลิก</div>" + cellList(st, "chal");
  } else if (st.phase === "prove") {
    if (mine && mine.ch.length && !mine.sent && !P.sent[st.round]) h = topBar(ra, "พิสูจน์!", tmHtml()) + keypad(st, mine);
    else if (mine && mine.ch.length) h = topBar(ra, "ส่งคำตอบแล้ว", tmHtml()) + '<div class="box"><h2>ส่งแล้ว ✓</h2><div class="muted">รอเฉลยบนจอใหญ่</div></div>';
    else h = topBar(ra, "เพื่อนกำลังพิสูจน์", tmHtml()) + '<div class="tip">คนที่ถูกท้ากำลังพิมพ์คำตอบ ลองแยกตัวประกอบในใจไปด้วย!</div>' + cellList({ cells: st.cells.filter(function (c) { return c.ch.length; }), maxCh: st.maxCh }, "view").replace(/<div class="grp">[^<]*<\/div>/g, "");
  } else if (st.phase === "rev") {
    var d = row ? row.d : 0, box = "";
    if (mine) {
      var r = mine.res || {}, typed = r.kind !== "chal" ? "" : !r.sent ? "ไม่ได้ส่งคำตอบ" : r.claim ? "คุณกด “ช่องนี้แยกไม่ได้”" : "คุณพิมพ์ " + esc(r.f) + " x = " + esc(r.r1) + ", " + esc(r.r2);
      box = '<div class="box"><div class="muted" style="font-size:.9rem">สมการของคุณ ' + mine.pts + ' คะแนน</div><div class="hd" style="font-weight:700;font-size:1.3rem">' + esc(mine.eq) + "</div>" +
        '<div style="margin-top:6px"><b>เฉลย:</b> ' + (mine.decoy ? "ช่องหลอก แยกตัวประกอบด้วยจำนวนเต็มไม่ได้" : esc(mine.key) + "<br>" + esc(mine.roots)) + "</div>" +
        (r.kind === "chal" ? '<div style="margin-top:6px">' + typed + "</div>" + '<h2 class="' + (r.ok ? "ok" : "no") + '" style="margin-top:6px">' + (r.ok ? "✓ พิสูจน์ได้" : "✗ ไม่ผ่าน" + (r.sent && !r.claim && !mine.decoy ? (!r.fOk && !r.rOk ? " (ผิดทั้งรูปและคำตอบ)" : !r.fOk ? " (รูปแยกตัวประกอบผิด)" : " (คำตอบผิด)") : "")) + "</h2>" : '<h2 class="ok" style="margin-top:6px">ไม่มีคนท้า</h2>') + "</div>";
    }
    var mych = st.cells.filter(function (c) { return c.ch.indexOf(P.pid) >= 0; }).map(function (c) { var r = c.res || {}; return '<div class="tr"><span style="flex:1">คุณท้า ' + esc(pName(c.o)) + " " + esc(c.eq) + '</span><b class="' + (r.ok ? "no" : "ok") + '">' + (r.ok ? "เขาทำได้" : "ท้าสำเร็จ") + "</b></div>"; }).join("");
    h = topBar(ra, "เฉลย", '<span class="tm" style="font-size:1rem">' + (d > 0 ? "+" + d : d < 0 ? "−" + Math.abs(d) : "0") + "</span>") + box + (mych ? '<div class="box">' + mych + "</div>" : "") +
      (!mine && !mych ? '<div class="box"><div class="muted">รอบนี้คุณไม่ได้จองหรือท้า ดูเฉลยบนจอใหญ่</div></div>' : "") +
      '<div class="box"><h2>อันดับ</h2>' + st.rows.slice(0, 8).map(function (r) { return '<div class="tr' + (r.pid === P.pid ? " me" : "") + '"><span class="muted" style="width:26px">' + r.rk + '</span><b style="flex:1">' + esc(r.name) + '</b><span class="' + (r.d > 0 ? "ok" : r.d < 0 ? "no" : "muted") + '" style="width:44px;text-align:right">' + (r.d ? (r.d > 0 ? "+" : "−") + Math.abs(r.d) : "") + "</span><b style=\"width:40px;text-align:right\">" + r.score + "</b></div>"; }).join("") + (row && row.rk > 8 ? '<div class="tr me"><span class="muted" style="width:26px">' + row.rk + '</span><b style="flex:1">' + esc(row.name) + "</b><b>" + row.score + "</b></div>" : "") + "</div>" +
      '<div class="muted" style="text-align:center">รอครูไปรอบถัดไป</div>';
  } else if (st.phase === "end") {
    var ws = st.rows.filter(function (r) { return (st.winners || []).indexOf(r.pid) >= 0; });
    h = topBar(esc(P.name), "จบเกมแล้ว") + '<div class="box" style="text-align:center"><div class="muted">' + (ws.length > 1 ? "ผู้ชนะร่วม" : "ผู้ชนะ") + '</div><div class="hd" style="font-size:1.8rem;font-weight:800">' + ws.map(function (r) { return esc(r.name); }).join(" และ ") + "</div><div>" + (ws[0] ? ws[0].score : 0) + " คะแนน</div></div>" +
      '<div class="box"><h2>อันดับทั้งหมด</h2>' + st.rows.map(function (r) { return '<div class="tr' + (r.pid === P.pid ? " me" : "") + '"><span class="muted" style="width:26px">' + r.rk + '</span><b style="flex:1">' + esc(r.name) + (r.pid === P.pid ? " (คุณ)" : "") + "</b><b>" + r.score + "</b></div>"; }).join("") + "</div>";
  }
  if ((st.v || 0) < FX_V) h = '<div class="err">หน้าจอใหญ่เป็นเวอร์ชันเก่า ให้ครูรีเฟรชหน้าจอใหญ่</div>' + h;
  return '<div id="pw">' + h + "</div>";
}
function renderPlayer() {
  if (!P.joined || !P.st) return;
  var y = window.scrollY; document.getElementById("app").innerHTML = viewPlayer(); window.scrollTo(0, y);
}
function onPlayerMsg(m) {
  if (!m) return;
  if (m.type === "reject" && m.to === P.pid) { P.error = m.reason; P.joining = false; P.joined = false; Net.close(); ss("fx-joined", "0"); document.getElementById("app").innerHTML = viewJoin(); return; }
  if (m.type === "adopt" && m.to === P.pid) { P.pid = m.pid; ss("fx-pid", P.pid); Net.send({ type: "join", pid: P.pid, name: P.name, v: FX_V }); return; }
  if (m.type !== "state") return;
  if (!inPlayers(m) && !P.joined) return;
  var prev = P.st ? P.st.phase + P.st.round : "";
  P.st = m; P.recvAt = Date.now();
  if (inPlayers(m) && !P.joined) { P.joined = true; P.joining = false; P.error = ""; ss("fx-name", P.name); ss("fx-code", P.code); ss("fx-joined", "1"); }
  if (prev !== m.phase + m.round) window.scrollTo(0, 0);
  renderPlayer();
}
function pjoin() {
  var code = (document.getElementById("code").value || "").replace(/\D/g, ""), name = document.getElementById("nick").value.trim().slice(0, 20);
  P.code = code; P.name = name;
  if (!/^\d{4}$/.test(code)) { P.error = "รหัสห้องมี 4 หลัก"; document.getElementById("app").innerHTML = viewJoin(); return; }
  if (!name) { P.error = "กรอกชื่อเล่นก่อน"; document.getElementById("app").innerHTML = viewJoin(); return; }
  P.error = ""; P.joining = true; document.getElementById("app").innerHTML = viewJoin();
  Net.open(code, P.pid, onPlayerMsg); Net.send({ type: "join", pid: P.pid, name: name, v: FX_V });
  setTimeout(function () { if (!P.joined && P.joining) { P.joining = false; P.error = "ไม่พบห้องนี้ ตรวจรหัสห้อง และให้แน่ใจว่าจอใหญ่เปิดหน้าเกมไว้"; Net.close(); ss("fx-joined", "0"); document.getElementById("app").innerHTML = viewJoin(); } }, 8000);
}
function sendAns(m) {
  var st = P.st; P.sent[st.round] = 1; Net.send(m); renderPlayer();
  setTimeout(function () { var c = P.st && P.st.cells ? P.st.cells.filter(function (x) { return x.o === P.pid; })[0] : null; if (P.st && P.st.phase === "prove" && c && !c.sent) Net.send(m); }, 2500);   /* resend once if the Host did not get it */
}
var PACT = {
  join: pjoin,
  reload: function () { location.reload(); },
  leave: function () { P.joined = false; P.st = null; Net.close(); ss("fx-joined", "0"); document.getElementById("app").innerHTML = viewJoin(); },
  pick: function (b) { var st = P.st; if (!st || st.phase !== "pick") return; Net.send({ type: "pick", pid: P.pid, round: st.round, cell: Number(b.dataset.c) }); },
  chal: function (b) { var st = P.st; if (!st || st.phase !== "chal") return; Net.send({ type: "chal", pid: P.pid, round: st.round, cell: Number(b.dataset.c) }); },
  fld: function (b) { K.a = Number(b.dataset.i); K.arm = false; renderPlayer(); },
  key: function (b) {
    var k = b.dataset.k, v = K.f[K.a];
    if (k === "⌫") v = v.slice(0, -1);
    else if (k === "ล้าง") v = "";
    else if (k === "◂") K.a = Math.max(0, K.a - 1);
    else if (k === "▸") K.a = Math.min(2, K.a + 1);
    else if (v.length < (K.a === 0 ? 30 : 10)) v += k;
    if (k !== "◂" && k !== "▸") K.f[K.a] = v;
    K.arm = false; renderPlayer();
  },
  decoy: function () {
    var st = P.st; if (!st || st.phase !== "prove" || P.sent[st.round]) return;
    if (!K.arm) { K.arm = true; renderPlayer(); clearTimeout(K.armT); K.armT = setTimeout(function () { if (K.arm) { K.arm = false; renderPlayer(); } }, 3000); return; }
    K.arm = false; sendAns({ type: "ans", pid: P.pid, round: st.round, decoy: true });
  },
  submit: function () {
    var st = P.st; if (!st || st.phase !== "prove" || P.sent[st.round] || !(K.f[0] && K.f[1] && K.f[2])) return;
    sendAns({ type: "ans", pid: P.pid, round: st.round, f: K.f[0], r1: K.f[1], r2: K.f[2] });
  }
};
function playerBoot() {
  MODE = "player"; document.body.className = ""; ss("fx-role", "player");
  var app = document.getElementById("app");
  app.addEventListener("click", function (e) { var b = e.target.closest("[data-a]"); if (!b || b.disabled) return; if (PACT[b.dataset.a]) PACT[b.dataset.a](b); });
  setInterval(function () { var t = document.getElementById("tm"); if (t && P.st && P.st.phase !== "rev") { var l = pLeft(); t.textContent = l === null ? "–" : Math.ceil(l / 1000); } }, 200);
  var jm = /^#join=(\d{4})$/.exec(location.hash || "");
  if (jm) P.code = jm[1]; else if (ss("fx-joined") === "1") P.code = ss("fx-code") || "";
  app.innerHTML = viewJoin();
  if (P.code && P.name && ss("fx-joined") === "1") pjoin();
}

/* ============================================================ start ============================================================ */
function roleScreen() {
  var app = document.getElementById("app");
  app.innerHTML = '<div class="role"><h1>Calcu แยกตัวประกอบ</h1><p>จองสมการกำลังสอง ท้าเพื่อน แล้วพิสูจน์ด้วยการแยกตัวประกอบ</p>' +
    '<button class="rbtn pri" data-r="player">เข้าห้อง<small>นักเรียน: ใส่รหัสห้องจากจอใหญ่ แล้วเล่นบนมือถือ</small></button>' +
    '<button class="rbtn" data-r="host">เปิดจอใหญ่ (Host)<small>ครู: ใช้จอนี้ขึ้นโปรเจกเตอร์ แสดงปิรามิดสมการและคะแนน</small></button></div>';
  app.onclick = function (e) { var b = e.target.closest("[data-r]"); if (!b) return; app.onclick = null; ({ host: hostBoot, player: playerBoot })[b.dataset.r](); };
}
(function () {
  var h = location.hash, r = ss("fx-role");
  if (h === "#host") hostBoot(); else if (h === "#player" || /^#join=\d{4}$/.test(h)) playerBoot();
  else if (r === "host") hostBoot(); else if (r === "player") playerBoot(); else roleScreen();
})();
</script>
