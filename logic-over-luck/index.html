.dice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    x: null, rerolled: false, rrLeft: true, rrDone: false, reff: null, acc: 0, hist: [], prevX: null, next6: false, det: null, rp: 0, acc0: 0 };
}
function uniqueName(name, pid) {
  name = String(name || "").trim().slice(0, 20) || "ผู้เล่น";
  var base = name, k = 2;
  while (H.players.some(function (p) { return p.name === name && p.pid !== pid; })) name = base + " " + (k++);
  return name;
}

/* messages from phones */
function onHostMsg(m) {
  if (!m || !H) return;
  if (m.type === "join") return hostJoin(m);
  if (m.type === "need") { if (byPid(m.pid)) { DIRTY[m.pid] = true; bcast(); } return; }
  if (m.type === "sec") {
    var p = byPid(m.pid), k = KEYS[m.pid]; if (!p || !k) return;
    Sec.dec(k, m).then(function (a) { hostAct(p, a); }, function () {});
  }
}
function hostJoin(m) {
  if (!m.pid || !m.pub) return;
  var p = byPid(m.pid);
  if (!p && H.phase !== "lobby") {   /* game already started: only someone coming back with the same name gets their seat */
    var same = H.players.filter(function (q) { return !q.bot && q.name === String(m.name || "").trim(); })[0];
    if (!same) { Net.send({ type: "reject", to: m.pid, msg: "เกมเริ่มไปแล้ว เข้าห้องนี้ไม่ได้ รอเกมหน้านะ" }); return; }
    Net.send({ type: "adopt", to: m.pid, pid: same.pid });
    return;
  }
  if (!p) { if (H.players.length >= 60) { Net.send({ type: "reject", to: m.pid, msg: "ห้องเต็มแล้ว" }); return; } p = newPlayer(m.pid, uniqueName(m.name, m.pid)); H.players.push(p); }
  else if (H.phase === "lobby" && m.name) p.name = uniqueName(m.name, p.pid);
  p.v = m.v || 0;
  if (JSON.stringify(p.pub) !== JSON.stringify(m.pub)) { p.pub = m.pub; delete KEYS[p.pid]; deriveFor(p); }
  else DIRTY[p.pid] = true;
  saveHost(); renderHost(); bcast();
}
/* a secret action from a phone (already decrypted, so it really comes from that player) */
function hostAct(p, a) {
  if (a.a === "build" && H.phase === "build") {
    if (!LOL.buildOk(a.cond, a.eff, { when: "start" })) return;
    p.cond = a.cond; p.eff = a.eff; p.built = true;
    if (H.players.every(function (q) { return q.built; })) H.deadline = Date.now() + 1500;
  } else if (a.a === "pick" && H.phase === "pick") {
    if (!LOL.DICE[a.die] || (H.banned || []).indexOf(a.die) >= 0) return;
    p.die = a.die;
    if (H.players.every(function (q) { return q.die; })) H.deadline = Date.now() + 800;
  } else if (a.a === "vote" && H.phase === "vote") {
    var V = H.vote;
    if (V.voters.indexOf(p.pid) < 0 || V.votes[p.pid] || V.opts.indexOf(a.opt) < 0) return;   /* one vote, voting group only */
    V.votes[p.pid] = [a.opt, Date.now()];
    if (V.voters.every(function (q) { return V.votes[q] || !byPid(q); })) H.deadline = Date.now() + 1200;
  } else if (a.a === "brk" && H.phase === "break") {
    if (p.brkDone) return;   /* one free change */
    if (!a.keep) {
      /* Compound Interest cannot be picked at the break; a player who already has it may keep it */
      var keepInt = p.eff === "interest" && a.eff === "interest";
      if (!LOL.buildOk(a.cond, a.eff, { when: keepInt ? "start" : "break" })) return;
      p.cond = a.cond; p.eff = a.eff;
    }
    p.brkDone = true; p.brkChanged = !a.keep;
    if (H.players.every(function (q) { return q.brkDone; })) H.deadline = Date.now() + 1500;
  } else if (a.a === "rr" && H.phase === "reroll") {
    if (!p.rrLeft || p.rrDone) return;
    p.rrDone = true;
    if (a.use) { p.x = pick(LOL.DICE[p.die]); p.rerolled = true; p.rrLeft = false; }
    if (rrAllDone()) H.deadline = Date.now() + 800;
  } else return;
  saveHost(); renderHost(); bcast();
}
function rrAllDone() { return H.players.every(function (q) { return !q.rrLeft || q.rrDone || q.rerolled; }); }

/* ---------- game flow ---------- */
function setPhase(ph, sec) { H.phase = ph; H.paused = 0; H.deadline = sec ? Date.now() + sec * 1000 : 0; H.phaseAt = Date.now(); }
function hostStart() {
  if (H.players.length < 2) return;
  H.runId = "lol-" + H.code + "-" + Date.now().toString(36);
  H.n = H.players.length;
  H.players.forEach(function (p) { p.built = false; p.cond = p.eff = null; p.acc = 0; p.hist = []; p.prevX = null; p.prevDie = null; p.next6 = false; p.rrLeft = true; p.det = null; p.rp = 0; });
  H.round = 0; H.places = null; H.room = null; H.rule = null; H.special = null; H.vote = null; H.curRules = []; H.banned = []; H.lucky = null;
  setPhase("build", Number(H.cfg.tBuild) || 60);
  botsDo(); saveHost(); renderHost(); bcast();
}
function advance() {
  if (H.phase === "build") finishBuild();
  else if (H.phase === "pick") endPick();
  else if (H.phase === "reroll") endReroll();
  else if (H.phase === "reveal") {
    if (H.round >= 12) endGame();
    else if (H.round === 6) startBreak();
    else if (H.round === 3 || H.round === 9) startVote(H.round + 1);
    else startRound(H.round + 1);
  }
  else if (H.phase === "vote") endVote();
  else if (H.phase === "voted") startRound(H.vote.round);
  else if (H.phase === "break") startVote(7);
  saveHost(); renderHost(); bcast();
}
function randomBuild(when) {
  var opts = [];
  Object.keys(LOL.COND).forEach(function (c) { Object.keys(LOL.EFF).forEach(function (e) { if (LOL.buildOk(c, e, { when: when })) opts.push([c, e]); }); });
  return pick(opts);
}
function finishBuild() {
  H.players.forEach(function (p) { if (!p.built) { var b = randomBuild("start"); p.cond = b[0]; p.eff = b[1]; p.built = true; p.autoBuilt = true; } });
  startRound(1);
}
/* vote before rounds 4, 7, 10: 3 rules not active now and not the special rule; the voting group = lowest-ranked at the start of the round */
function startVote(t) {
  var grp = LOL.votingGroup(H.players.map(function (p) { return p.acc; }), engCfg());
  H.vote = { round: t, opts: LOL.voteOptions([H.rule, H.special].filter(Boolean), rnd), voters: grp.map(function (i) { return H.players[i].pid; }), votes: {}, res: null };
  setPhase("vote", Number(H.cfg.tVote) || 20);
  botsDo();
}
function endVote() {
  var V = H.vote, list = Object.keys(V.votes).map(function (pid) { return { opt: V.votes[pid][0], t: V.votes[pid][1] }; });
  V.res = LOL.voteWinner(V.opts, list, rnd);
  H.rule = V.res.win;   /* replaces the current rule */
  setPhase("voted", 6);
}
/* mid-game break after round 6: reveal the final-round special rule (drawn from all 13), everyone may change their rule once */
function startBreak() {
  H.special = Number(H.cfg.special) ? pick(LOL.RULES) : null;
  H.players.forEach(function (p) { p.brkDone = false; p.brkChanged = false; });
  setPhase("break", Number(H.cfg.tBreak) || 180);
  botsDo();
}
function startRound(t) {
  H.round = t;
  H.curRules = activeRules(t);
  H.banned = H.curRules.indexOf("ban") >= 0 ? LOL.bannedDice(H.players.map(function (p) { return p.prevDie; })) : [];
  H.lucky = H.curRules.indexOf("lucky") >= 0 ? 1 + Math.floor(rnd() * 7) : null;   /* Lucky Number 1..7, shown before dice are picked */
  H.players.forEach(function (p) {
    p.die = null; p.x = null; p.rerolled = false; p.rrDone = false; p.det = null;
    p.reff = p.eff === "random" ? LOL.RANDOM_POOL[Math.floor(rnd() * LOL.RANDOM_POOL.length)] : null;   /* Random: equal chance of the 14 other effects */
  });
  setPhase("pick", Number(H.cfg.tPick) || 15);
  botsDo();
}
function endPick() {
  H.players.forEach(function (p) {
    var allowed = LOL.DIE_IDS.filter(function (d) { return H.banned.indexOf(d) < 0; });
    /* time ran out: keep last round's die (a random allowed die in round 1 or if it is banned) */
    if (!p.die) { p.die = p.prevDie && allowed.indexOf(p.prevDie) >= 0 ? p.prevDie : pick(allowed); p.autoDie = true; } else p.autoDie = false;
    p.x = pick(LOL.DICE[p.die]);
  });
  if (rrAllDone()) return endReroll();
  setPhase("reroll", Number(H.cfg.tRr) || 10);
  botsDo();
}
function endReroll() {
  var t = H.round, inp = { round: t, final: t === 12, rules: H.curRules.map(function (id) { return { id: id, scope: null }; }), banned: H.banned, lucky: H.lucky, cfg: engCfg(),
    players: H.players.map(function (p) {
      return { die: p.die, x: p.x, rerolled: p.rerolled, cond: p.cond, eff: p.eff === "random" ? p.reff : p.eff, acc: p.acc, prevX: p.prevX,
        next6: p.next6, aura: false, hist: p.hist.slice(), tie: (p.tie = rnd()) };
    }) };
  var res = LOL.scoreRound(inp), before = rankOf(H.players.map(function (p) { return p.acc; }));
  H.players.forEach(function (p, i) {
    var o = res.players[i];
    p.acc0 = p.acc; p.acc = res.acc[i]; p.rp = res.roundPts[i]; p.hist.push(res.roundPts[i]);
    p.next6 = o.next6Next; p.prevX = p.x; p.prevDie = p.die; p.rkBefore = before[i];
    p.det = { steps: o.steps, fired: o.fired, eff: o.eff, stolen: o.stolen || 0, crowded: o.crowded || 0, robin: o.robin || 0, delulu: o.delulu || 0, rp: o.roundPts, acc0: p.acc0, acc: p.acc };
  });
  H.room = { mean: res.room.mean, mode: res.room.mode, median: res.room.median, rr: res.room.someoneRerolled };
  setPhase("reveal", Number(H.cfg.tRev) || 12);
}
function endGame() {
  H.places = LOL.finalPlaces(H.players.map(function (p) { return p.acc; }), H.players.map(function (p) { return p.hist; }));
  setPhase("end", 0);
}

/* ---------- test bots (only with ?test in the Host's address) ---------- */
function addBots(k) {
  for (var i = 0; i < k; i++) { var pid = "bot" + newId(); H.players.push(newPlayer(pid, uniqueName("บอท " + (H.players.filter(function (p) { return p.bot; }).length + 1), pid), true)); }
  saveHost(); renderHost(); bcast();
}
function botsDo() {
  var ph = H.phase, t = H.round;
  H.players.forEach(function (p) {
    if (!p.bot) return;
    setTimeout(function () {
      if (H.phase !== ph || H.round !== t) return;
      if (ph === "build") { var b = randomBuild("start"); hostAct(p, { a: "build", cond: b[0], eff: b[1] }); }
      else if (ph === "pick") { var al = LOL.DIE_IDS.filter(function (d) { return H.banned.indexOf(d) < 0; }); hostAct(p, { a: "pick", die: rnd() < .7 && al.indexOf(p.prevDie) >= 0 ? p.prevDie : pick(al) }); }
      else if (ph === "reroll" && p.rrLeft) hostAct(p, { a: "rr", use: p.x <= 1 && rnd() < .5 });
      else if (ph === "vote" && H.vote.voters.indexOf(p.pid) >= 0) hostAct(p, { a: "vote", opt: pick(H.vote.opts) });
      else if (ph === "break") { if (rnd() < .7) hostAct(p, { a: "brk", keep: true }); else { var nb = randomBuild("break"); hostAct(p, { a: "brk", cond: nb[0], eff: nb[1] }); } }
    }, 400 + rnd() * 2500);
  });
}

/* ---------- what the phones get ---------- */
function leaderNames(i) {
  return LOL.leadersFor(i, H.players.map(function (p) { return p.acc; })).map(function (j) { return H.players[j].name; });
}
function privOf(p, i) {
  var o = { cond: p.cond, eff: p.eff, built: p.built, reff: p.reff, die: p.die, rrLeft: p.rrLeft, rrDone: p.rrDone, rerolled: p.rerolled };
  if (H.phase === "reroll" || H.phase === "reveal") o.x = p.x;   /* your own roll, before everyone sees it */
  if (H.phase === "reveal") o.det = p.det;
  if (p.cond === "samedie" || p.cond === "sameroll") o.leaders = leaderNames(i);
  if ((H.phase === "vote" || H.phase === "voted") && H.vote && H.vote.votes[p.pid]) o.myVote = H.vote.votes[p.pid][0];
  if (H.phase === "break") { o.brkDone = !!p.brkDone; o.brkChanged = !!p.brkChanged; }
  return o;
}
function publicState() {
  var accs = H.players.map(function (p) { return p.acc; }), rk = rankOf(accs);
  var st = { type: "state", v: LOL_V, code: H.code, room: H.cfg.room, phase: H.phase, round: H.round, n: H.players.length,
    left: H.deadline ? Math.max(0, H.deadline - Date.now()) : 0, paused: H.paused ? 1 : 0, hpub: HOSTKEY.pub,
    players: H.players.map(function (p, i) { return { pid: p.pid, name: p.name, idx: i, bot: p.bot, acc: p.acc, rank: rk[i] }; }),
    cnt: { built: H.players.filter(function (p) { return p.built; }).length, picked: H.players.filter(function (p) { return p.die; }).length } };
  if (H.phase === "reveal" || H.phase === "end") {
    st.rev = H.players.map(function (p) { return { die: p.prevDie, x: p.prevX, rp: p.rp, rk0: p.rkBefore }; });
    st.stat = H.room;
  }
  if (H.phase === "end") st.places = H.places;
  st.cur = H.curRules || []; st.banned = H.banned || []; st.lucky = H.lucky; st.rule = H.rule; st.special = H.special; st.cx = crowdXNow();
  if ((H.phase === "vote" || H.phase === "voted") && H.vote) {
    var V = H.vote;
    st.vote = { round: V.round, opts: V.opts, voters: V.voters, nv: Object.keys(V.votes).length, res: H.phase === "voted" ? V.res : null };   /* who voted what stays secret; the tally only after the vote */
  }
  if (H.phase === "break") st.cnt.brk = H.players.filter(function (p) { return p.brkDone; }).length;
  return st;
}
var BC = { t: null, last: 0, busy: false, again: false };
function bcast() {
  if (!H) return;
  if (BC.t) return;
  var gap = Math.min(1000, Math.max(150, H.players.length * 25)), wait = Math.max(0, BC.last + gap - Date.now());
  BC.t = setTimeout(sendState, wait);
}
function sendState() {
  BC.t = null;
  if (BC.busy) { BC.again = true; return; }
  BC.busy = true; BC.last = Date.now();
  var st = publicState(), jobs = [];
  st.sec = {}; st.pv = {};
  H.players.forEach(function (p, i) {
    if (p.bot) return;
    var j = JSON.stringify(privOf(p, i)), L = LASTPRIV[p.pid];
    if (!L || L.j !== j) { LASTPRIV[p.pid] = L = { j: j, v: ++PVC }; DIRTY[p.pid] = true; }
    st.pv[p.pid] = L.v;
    var k = KEYS[p.pid];
    if (k && DIRTY[p.pid]) {
      delete DIRTY[p.pid];
      var o = JSON.parse(j); o.pv = L.v;
      jobs.push(Sec.enc(k, o).then(function (e) { st.sec[p.pid] = e; }));
    }
  });
  Promise.all(jobs).then(function () {
    st.left = H.deadline ? Math.max(0, H.deadline - Date.now()) : 0;
    Net.send(st);
  }).then(function () { BC.busy = false; if (BC.again) { BC.again = false; bcast(); } }, function () { BC.busy = false; });
}

/* ---------- host controls ---------- */
var HACT = {
  start: function () { hostStart(); },
  bots: function () { addBots(5); },
  kick: function (b) {
    var pid = b.dataset.p;
    if (HV.kill !== pid) { HV.kill = pid; clearTimeout(HV.killT); HV.killT = setTimeout(function () { HV.kill = null; renderHost(); }, 3000); renderHost(); return; }
    HV.kill = null; Net.send({ type: "reject", to: pid, msg: "ครูนำคุณออกจากห้อง เข้าใหม่ได้ถ้าต้องการ" });
    H.players = H.players.filter(function (p) { return p.pid !== pid; }); H.players.forEach(function (p, i) { p.idx = i; });
    delete KEYS[pid]; delete LASTPRIV[pid]; saveHost(); renderHost(); bcast();
  },
  cfg: function () { HV.cfgOpen = true; renderHost(); },
  cfgSave: function () {
    var LIM = { tBuild: [5, 900], tPick: [3, 300], tRr: [3, 300], tRev: [3, 300], tVote: [5, 300], tBreak: [10, 900], votePct: [1, 100], voteCount: [0, 60], cap: [1, 50], crowdX: [0, 60] };
    Object.keys(DEF_CFG).forEach(function (k) {
      var el = document.getElementById("cf_" + k); if (!el) return;
      if (k === "room") H.cfg.room = el.value.trim().slice(0, 30) || DEF_CFG.room;
      else if (k === "special") H.cfg.special = el.checked ? 1 : 0;
      else { var n = Math.round(Number(el.value)); if (!isFinite(n) || el.value.trim() === "") n = DEF_CFG[k]; H.cfg[k] = Math.max(LIM[k][0], Math.min(LIM[k][1], n)); }
    });
    ls("lol-cfg", JSON.stringify(H.cfg)); HV.cfgOpen = false; saveHost(); renderHost(); bcast();
  },
  cfgClose: function () { HV.cfgOpen = false; renderHost(); },
  pause: function () {
    if (H.paused) { H.deadline = Date.now() + H.paused; H.paused = 0; }
    else if (H.deadline) { H.paused = Math.max(1000, H.deadline - Date.now()); H.deadline = 0; }
    saveHost(); renderHost(); bcast();
  },
  skip: function () { if (H.paused) { H.paused = 0; } H.deadline = Date.now(); },
  end: function () {

    HV.endAsk = 0; endGame(); saveHost(); renderHost(); bcast();
  },
  again: function () { H.phase = "lobby"; H.round = 0; H.places = null; H.deadline = 0; H.paused = 0; saveHost(); renderHost(); bcast(); },
  newroom: function () { if (!confirm("สร้างห้องใหม่? ผู้เล่นทุกคนต้องเข้าห้องใหม่ด้วยรหัสใหม่")) return; H.players.forEach(function (p) { if (!p.bot) Net.send({ type: "reject", to: p.pid, msg: "ครูปิดห้องนี้แล้ว" }); }); newRoom(); }
};
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-h]"); if (!b || !H || b.disabled) return;
  if (HACT[b.dataset.h]) HACT[b.dataset.h](b);

/* ---------- host screens ---------- */
var PHASE_T = { lobby: "รอผู้เล่น", build: "สร้างกฎส่วนตัว", vote: "โหวตกฎส่วนรวม", voted: "ผลโหวต", break: "พักครึ่ง", pick: "เลือกลูกเต๋า", reroll: "ทอยแล้ว รอตัดสินใจทอยใหม่", reveal: "เปิดผล", end: "จบเกม" };

var QRC = { code: "", svg: "" };

function tickHost() {

  var s = secs(H.deadline - Date.now()); if (el.textContent !== String(s)) { el.textContent = s; el.classList.toggle("warn", s <= 5); }
}
function hdr(title, sub) {

    '<div class="hc"><div class="ti">' + title + '</div><div class="su">' + (sub || "") + '</div></div><div class="hr">' + timerHtml() + "</div></div>";

  var ask = Date.now() - HV.endAsk < 4000;
  return '<div class="ftr"><div style="display:flex;gap:14px"><button class="gb" data-h="pause">' + (H.paused ? "▶ เดินเวลาต่อ" : "⏸ หยุดเวลา") + '</button><button class="gb" data-h="skip">⏭ จบเวลาเฟสนี้</button></div>' +

}
function renderHost() {

  var h = "", ph = H.phase, n = H.players.length;
  if (ph === "lobby") {
    var cs = n > 30 ? "font-size:21px;padding:3px 6px 3px 14px" : n > 20 ? "font-size:24px" : "";
    var chips = H.players.map(function (p) { var k = HV.kill === p.pid; return '<span class="chip' + (k ? " kill" : "") + '" style="' + cs + '">' + (p.bot ? "🤖 " : "") + esc(p.name) + '<button class="kx" data-h="kick" data-p="' + esc(p.pid) + '" aria-label="ลบ ' + esc(p.name) + '">' + (k ? "ลบ?" : "✕") + "</button></span>"; }).join("");

  if (PACT[b.dataset.p]) PACT[b.dataset.p](b);
});
document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target && (e.target.id === "jc" || e.target.id === "jn")) PACT.join(); });

function renderPlayer(force) {
  var app = document.getElementById("app"); if (!app) return;
  var html = playerHtml();
  if (!force && html === P.view) return;   /* nothing changed: keep the page (taps and scrolling are not disturbed) */
  P.view = html;
  var y = window.scrollY, keepJ = document.getElementById("jc") ? [document.getElementById("jc").value, document.getElementById("jn").value] : null;
  app.innerHTML = '<div id="pw">' + html + "</div>";
  if (keepJ && document.getElementById("jc")) { document.getElementById("jc").value = keepJ[0]; document.getElementById("jn").value = keepJ[1]; }
  window.scrollTo(0, y);
  tickPlayer();
}
function pTop(title, sub, timer) {
  return '<div class="ptop"><div><div class="t">' + title + '</div><div class="s">' + (sub || "") + "</div></div>" + (timer ? (P.st && P.st.paused ? '<div class="tm" style="font-size:.9rem">หยุด</div>' : '<div class="tm" id="ptm">' + secs(leftMs()) + "</div>") : "") + "</div>";
}
function statusBar() {
  var st = P.st, me = myPub(); if (!me) return "";
  return '<div class="sbar"><span>' + esc(me.name) + "</span><span>คะแนนสะสม <b>" + num(me.acc) + "</b></span><span>อันดับ <b>" + me.rank + "</b>/" + st.n + "</span><span>ทอยใหม่ <b>" + (P.priv && P.priv.rrLeft ? "1" : "0") + "</b></span></div>";
}
/* at the break Compound Interest can only be kept, not newly picked */
function breakOk(c, e) { var pr = P.priv || {}; return LOL.buildOk(c, e, { when: e === "interest" && pr.eff === "interest" ? "start" : "break" }); }
/* common rules in force, lucky number and banned dice (public) */
function rulesBoxP(st) {
  var out = (st.cur || []).map(function (id) { return '<div class="crule"><b>กฎส่วนรวม' + (st.round === 12 && id === st.special ? "พิเศษ" : "") + ": " + esc(RULE_T[id]) + "</b><br>" + esc(ruleDesc(id, st.cx)) + "</div>"; });
  if (st.lucky != null) out.push('<div class="crule"><b>เลขนำโชครอบนี้: ' + st.lucky + "</b></div>");
  return out.join("");
}
function optList(kind, table, prices, when) {
  var sel = P.sel, pr = P.priv || {};
  return Object.keys(prices).map(function (k) {
    var other = kind === "cond" ? sel.eff : sel.cond, cost = prices[k] + (other ? (kind === "cond" ? LOL.EFF[other] : LOL.COND[other]) : 0);
    var on = sel[kind] === k, off = cost > 5 && !on;
    if (kind === "eff" && k === "interest" && when === "break" && pr.eff !== "interest") off = true;
    return '<button class="opt' + (on ? " on" : "") + '" data-p="' + kind + '" data-v="' + esc(k) + '"' + (off ? " disabled" : "") + '><span class="pr">' + prices[k] + '</span><span><span class="nm">' + esc(table[k][0]) + '</span><br><span class="ds">' + esc(table[k][1]) + "</span></span></button>";
  }).join("");
}
function myPub() { var st = P.st; if (!st) return null; return st.players.filter(function (p) { return p.pid === P.pid; })[0] || null; }
function ruleBox(pr) {
  if (!pr || !pr.cond) return "";
  var h = '<div class="rule"><b>กฎของคุณ:</b> ถ้า ' + esc(condName(pr.cond)) + " → " + esc(effName(pr.eff));
  if (pr.eff === "random" && pr.reff) h += '<br><b>รอบนี้สุ่มได้:</b> ' + esc(effName(pr.reff));
  if (pr.leaders && pr.leaders.length) h += "<br><b>ผู้นำของคุณ:</b> " + esc(pr.leaders.join(", "));
  return h + "</div>";
}
function playerHtml() {
  var st = P.st, pr = P.priv;
  if (!P.joined) {
    var c0 = P.code || "", connecting = P.joinT && !P.err && Net.ch;
    return '<div class="ptop"><div><div class="t" style="font-size:1.8rem">Logic over Luck</div><div class="s">ชมรมคณิตศาสตร์ เล่นร่วมกันบนจอใหญ่</div></div></div>' +
      '<div class="pc" style="display:flex;flex-direction:column;gap:12px"><label><span class="lbl">รหัสห้อง (4 หลัก)</span><input id="jc" class="inp" inputmode="numeric" maxlength="4" autocomplete="off" value="' + esc(c0) + '"></label>' +
      '<label><span class="lbl">ชื่อเล่น</span><input id="jn" class="inp" maxlength="20" autocomplete="nickname" value="' + esc(P.name) + '"></label>' +
      (P.err ? '<div class="err" role="alert">' + esc(P.err) + "</div>" : "") +
      '<button class="btn" data-p="join"' + (connecting ? " disabled" : "") + ">" + (connecting ? "กำลังเข้าห้อง…" : "เข้าร่วม") + "</button></div>" +
      '<a href="/games/" class="muted">← กลับเว็บชมรม</a>';
  }
  if (st.v > LOL_V) return '<div class="verw">มีเวอร์ชันใหม่ของเกม กดรีเฟรชเพื่อเล่นต่อ (คะแนนไม่หาย)</div><button class="btn" data-p="reload">รีเฟรชหน้า</button>';
  var warnOld = st.v < LOL_V ? '<div class="verw">จอใหญ่ใช้เกมเวอร์ชันเก่า บอกครูให้รีเฟรชจอใหญ่</div>' : "";
  var ph = st.phase, me = myPub(), h = warnOld;
  if (!pr && ph !== "lobby") return h + pTop("กำลังรับข้อมูล…", "รอสักครู่") + '<div class="muted">ถ้าค้างนาน ลองรีเฟรชหน้า</div>';
  if (ph === "lobby") {
    P.sel = { cond: null, eff: null };
    return h + pTop("เข้าห้องแล้ว", "ห้อง " + esc(st.code) + " " + esc(st.room)) + '<div class="pc"><div style="font-size:1.3rem;font-weight:700">' + esc(me.name) + '</div><div class="muted">รอครูกดเริ่มเกม ระหว่างนี้ศึกษากฎส่วนรวมและกฎส่วนตัวไว้ก่อน เพราะเวลาสร้างกฎสั้น</div><div class="muted">ผู้เล่นในห้อง ' + st.n + " คน</div></div>" +
      '<button class="btn alt" data-p="leave">ออกจากห้อง</button>';
  }
  h += statusBar();
  if (ph === "build") {
    if (!P.sel.cond && !P.sel.eff && pr.built) { P.sel.cond = pr.cond; P.sel.eff = pr.eff; }
    var sel = P.sel, used = (sel.cond ? LOL.COND[sel.cond] : 0) + (sel.eff ? LOL.EFF[sel.eff] : 0);
    var sent = pr.built ? '<div class="ok">✓ ส่งกฎแล้ว: ถ้า ' + esc(condName(pr.cond)) + " → " + esc(effName(pr.eff)) + " (เปลี่ยนได้จนหมดเวลา)</div>" : '<div class="muted">ยังไม่ได้ส่งกฎ ถ้าหมดเวลา ระบบสุ่มกฎให้</div>';
    return h + pTop("สร้างกฎส่วนตัว", "เงื่อนไข 1 ข้อ + ผล 1 ข้อ ไม่เกิน 5 เหรียญ", true) +
      '<div class="pc budget"><div style="display:flex;justify-content:space-between;font-weight:700"><span>ใช้ไป ' + used + ' / 5 เหรียญ</span><span>' + (sel.cond && sel.eff ? "ครบแล้ว" : "เลือกให้ครบ") + "</span></div>" +
      '<div class="muted">ถ้า ' + (sel.cond ? esc(condName(sel.cond)) : "…") + " → " + (sel.eff ? esc(effName(sel.eff)) : "…") + "</div>" +
      '<button class="btn" data-p="build" style="width:100%;margin-top:8px"' + (sel.cond && sel.eff ? "" : " disabled") + ">ส่งกฎนี้</button></div>" + sent +
      '<div class="pc"><div class="lbl">1. เงื่อนไข</div><div class="opts">' + optList("cond", COND_T, LOL.COND, "start") + "</div></div>" +
      '<div class="pc"><div class="lbl">2. ผล</div><div class="opts">' + optList("eff", EFF_T, LOL.EFF, "start") + "</div></div>";
  }
  if (ph !== "break") P.brkInit = 0;
  if (ph === "vote" || ph === "voted") {
    var V = st.vote, voter = V.voters.indexOf(P.pid) >= 0, mv = pr.myVote || (P.pend && P.pend.a === "vote" ? P.pend.opt : null);
    if (ph === "voted") {
      return h + pTop("ผลโหวต", "กฎส่วนรวมรอบที่ " + V.round + "–" + (V.round + 2), true) + V.opts.map(function (id) {
        return '<div class="vopt' + (id === V.res.win ? " on" : "") + '"><div class="nm">' + (id === V.res.win ? "✓ " : "") + esc(RULE_T[id]) + " (" + V.res.tally[id] + ' เสียง)</div><div class="ds">' + esc(ruleDesc(id, st.cx)) + "</div></div>";
      }).join("") + (V.res.how === "random" ? '<div class="muted">ไม่มีใครโหวต ระบบสุ่ม</div>' : V.res.how === "tie" ? '<div class="muted">คะแนนเท่ากัน ข้อที่ได้รับโหวตก่อนชนะ</div>' : "");
    }
    var list = V.opts.map(function (id) {
      var on = (mv || P.vsel) === id;
      return '<button class="vopt' + (on ? " on" : "") + '" data-p="vsel" data-v="' + esc(id) + '"' + (!voter || mv ? " disabled" : "") + '><div class="nm">' + esc(RULE_T[id]) + '</div><div class="ds">' + esc(ruleDesc(id, st.cx)) + "</div></button>";
    }).join("");
    return h + pTop("โหวตกฎส่วนรวม", "ก่อนรอบที่ " + V.round + " (โหวตได้ 1 ครั้ง)", true) + list +
      (!voter ? '<div class="muted">รอบนี้คุณไม่ได้อยู่ในกลุ่มโหวต (กลุ่มโหวต = อันดับครึ่งล่าง) รอผลโหวต</div>' :
        mv ? '<div class="ok">✓ โหวต ' + esc(RULE_T[mv]) + " แล้ว" + (pr.myVote ? "" : " (กำลังส่ง…)") + "</div>" :
        '<button class="btn" data-p="vote"' + (P.vsel ? "" : " disabled") + ">ยืนยันโหวต</button>") +
      '<div class="muted">โหวตแล้ว ' + V.nv + " / " + V.voters.length + " คน</div>";
  }
  P.vsel = null;
  if (ph === "break") {
    if (P.brkInit !== st.round) { P.brkInit = st.round; P.sel = { cond: pr.cond, eff: pr.eff }; }
    var spc = st.special ? '<div class="crule"><b>กฎพิเศษรอบสุดท้าย (เพิ่มในรอบ 12): ' + esc(RULE_T[st.special]) + "</b><br>" + esc(ruleDesc(st.special, st.cx)) + "</div>" : "";
    if (pr.brkDone || (P.pend && P.pend.a === "brk")) {
      return h + pTop("พักครึ่ง", "รอทุกคนตัดสินใจ", true) + spc + ruleBox(pr) +
        '<div class="ok">' + (pr.brkDone ? (pr.brkChanged ? "✓ เปลี่ยนกฎแล้ว" : "✓ ใช้กฎเดิม") : "กำลังส่ง…") + "</div><div class=\"muted\">ตัดสินใจแล้ว " + (st.cnt.brk || 0) + " / " + st.n + " คน</div>";
    }
    var bs = P.sel, bOk = bs.cond && bs.eff && breakOk(bs.cond, bs.eff), same = bs.cond === pr.cond && bs.eff === pr.eff;
    return h + pTop("พักครึ่ง", "เปลี่ยนกฎส่วนตัวได้ 1 ครั้ง ไม่เลือกถือว่าใช้กฎเดิม", true) + spc + ruleBox(pr) +
      '<button class="btn alt" data-p="bkeep">ใช้กฎเดิม</button>' +
      '<div class="pc budget"><div style="display:flex;justify-content:space-between;font-weight:700"><span>กฎใหม่ ใช้ไป ' + ((bs.cond ? LOL.COND[bs.cond] : 0) + (bs.eff ? LOL.EFF[bs.eff] : 0)) + ' / 5 เหรียญ</span></div>' +
      '<div class="muted">ถ้า ' + (bs.cond ? esc(condName(bs.cond)) : "…") + " → " + (bs.eff ? esc(effName(bs.eff)) : "…") + "</div>" +
      '<button class="btn" data-p="bsend" style="width:100%;margin-top:8px"' + (bOk && !same ? "" : " disabled") + ">เปลี่ยนเป็นกฎนี้ (ครั้งเดียว)</button></div>" +
      '<div class="pc"><div class="lbl">1. เงื่อนไข</div><div class="opts">' + optList("cond", COND_T, LOL.COND, "break") + "</div></div>" +
      '<div class="pc"><div class="lbl">2. ผล</div><div class="opts">' + optList("eff", EFF_T, LOL.EFF, "break") + "</div></div>";
  }
  var rt = "รอบที่ " + st.round + " / 12" + (st.round === 12 ? " คะแนน ×2" : "");
  if (ph === "pick") {
    var mine = P.pend && P.pend.a === "pick" ? P.pend.die : pr.die;
    var ban = st.banned || [];
    return h + pTop(rt, "เลือกลูกเต๋า (เปลี่ยนได้จนหมดเวลา)", true) + ruleBox(pr) + rulesBoxP(st) +
      '<div class="dice">' + LOL.DIE_IDS.map(function (d) { var b = ban.indexOf(d) >= 0; return '<button class="die' + (mine === d ? " on" : "") + '" data-p="die" data-v="' + d + '"' + (b ? " disabled" : "") + '><div class="n">' + DIE_T[d] + '</div><div class="f">' + (b ? "ห้ามใช้รอบนี้" : facesOf(d)) + "</div></button>"; }).join("") + "</div>" +
      (mine ? '<div class="ok">✓ เลือก ' + DIE_T[mine] + " แล้ว</div>" : P.pend && P.pend.a === "pick" ? '<div class="muted">กำลังส่ง…</div>' : '<div class="muted">ไม่เลือกภายในเวลา ระบบใช้ลูกเดิมจากรอบก่อน (รอบแรกสุ่มให้)</div>') +
      '<div class="muted">เลือกแล้ว ' + st.cnt.picked + " / " + st.n + " คน</div>";
  }
  if (ph === "reroll") {
    var canRr = pr.rrLeft && !pr.rrDone && !pr.rerolled;
    return h + pTop(rt, "ผลทอยของคุณ (คนอื่นยังไม่เห็น)", true) + ruleBox(pr) + rulesBoxP(st) +
      '<div class="pc"><div class="muted" style="text-align:center">' + DIE_T[pr.die] + '</div><div class="roll">' + pr.x + "</div>" +
      (pr.rerolled ? '<div class="ok" style="text-align:center">ทอยใหม่แล้ว ผลนี้คือผลจริงของรอบนี้</div>' : "") + "</div>" +
      (canRr ? '<div class="muted">คุณมีสิทธิ์ทอยใหม่ 1 ครั้งต่อเกม ทอยใหม่แล้วต้องใช้ผลใหม่</div><div class="dice"><button class="btn" data-p="rr" data-v="1">ทอยใหม่</button><button class="btn alt" data-p="rr" data-v="0">ใช้ผลนี้</button></div>' + (P.pend && P.pend.a === "rr" ? '<div class="muted">กำลังส่ง…</div>' : "")
        : '<div class="muted">' + (pr.rrLeft ? "ใช้ผลนี้แล้ว" : "ใช้สิทธิ์ทอยใหม่ไปแล้ว") + " รอคนอื่นตัดสินใจ</div>");
  }
  if (ph === "reveal") {
    var d = pr.det || {}, rv = st.rev || [], mi = me.idx, my = rv[mi] || {};
    return h + pTop("ผลรอบที่ " + st.round, st.round < 12 ? "รอบถัดไปเริ่มเอง" : "รอดูผลสุดท้าย", true) + ruleBox(pr) + rulesBoxP(st) +
      '<div class="pc"><div style="display:flex;justify-content:space-between;align-items:center"><span>' + DIE_T[my.die] + " ทอยได้ <b style=\"font-size:1.6rem\">" + my.x + '</b></span><span style="font-family:Prompt,sans-serif;font-weight:700;font-size:1.8rem">' + sign(d.rp || 0) + "</span></div>" +
      '<div class="steps" style="margin-top:8px">' + stepsHtml(d) + "</div>" +
      '<div style="margin-top:10px;font-weight:700">คะแนนสะสม ' + num(d.acc0) + " → " + num(d.acc) + " อันดับ " + me.rank + " จาก " + st.n + "</div></div>" +
      '<div class="muted">' + (st.stat && st.stat.rr ? "รอบนี้มีคนทอยใหม่" : "รอบนี้ไม่มีใครทอยใหม่") + "</div>";
  }
  if (ph === "end") {
    var pl = st.places ? st.places[me.idx] : me.rank;
    return h + pTop("จบเกม", "Logic over Luck") + '<div class="pc" style="text-align:center"><div class="muted">อันดับของคุณ</div><div class="roll">' + pl + '</div><div style="font-weight:700">จาก ' + st.n + " คน คะแนนสะสม " + num(me.acc) + "</div></div>" +
      '<div class="muted">คะแนนสะสมเท่ากัน ตัดสินด้วยคะแนนรอบ 12, 11, ... ตามลำดับ</div><button class="btn alt" data-p="leave">ออกจากห้อง</button>';
  }
  return h;
}
function stepsHtml(d) {
  var out = [];
  function row(label, v) { out.push("<div><span>" + label + "</span><b class=\"" + (v > 0 ? "p" : v < 0 ? "m" : "") + "\">" + (typeof v === "number" ? sign(v) : v) + "</b></div>"); }
  (d.steps || []).forEach(function (s) {
    if (s.k === "face") row("แต้มหน้าลูกเต๋า" + (s.cursed ? " (โดนพากันลงเหว)" : ""), String(s.v));
    else if (s.k === "personal") { if (s.fired) row("กฎส่วนตัวผ่าน: " + esc(effName(s.eff)), s.d); else row("เงื่อนไขของกฎส่วนตัวไม่ผ่าน", "–"); }
    else if (s.k === "next6") row("+6 จากรอบที่แล้ว", 6);
    else if (s.k === "common") row(esc(RULE_T[s.id] || s.id), s.d);
    else if (s.k === "floor") row("ติดลบ ปัดเป็น 0", s.d);
    else if (s.k === "bust") row("เกิน 10 แตก", s.d);
    else if (s.k === "gain") row("ได้จาก " + esc(effName(d.eff)), s.d);
    else if (s.k === "double") row("รอบสุดท้าย คูณ 2", s.d);
  });
  if (d.stolen) row("ถูกหักจากคะแนนสะสม (ขโมย/ตัดหน้า)", -d.stolen);
  if (d.delulu) row("ทายผิด", d.delulu);
  if (d.crowded) row(esc(RULE_T.crowded), d.crowded);
  if (d.robin) row(esc(RULE_T.robin), d.robin);
  return out.join("");
}

/* =====================================================================
   start: #host = big screen, #join=CODE or #player = phone, nothing = choose
   ===================================================================== */
(function boot() {
  var hs = location.hash || "";
  if (hs === "#host") return hostBoot();
  var mj = hs.match(/^#join=(\d{4})/);
  if (mj || hs === "#player") return playerBoot(mj ? mj[1] : "");
  if (ss("lol-joined")) return playerBoot("");
  document.getElementById("app").innerHTML = '<div class="role"><h1>Logic over Luck</h1><p>เกมลูกเต๋าที่ตรรกะชนะดวง สร้างกฎส่วนตัว เลือกลูกเต๋า แล้วแข่งกัน 12 รอบ</p>' +
    '<button class="rbtn pri" onclick="location.hash=\'#player\';location.reload()">เข้าห้อง<small>ผู้เล่น ใส่รหัสห้องจากจอใหญ่</small></button>' +
    '<button class="rbtn" onclick="location.hash=\'#host\';location.reload()">เปิดจอใหญ่<small>ครู ใช้จอคอมหรือโปรเจกเตอร์</small></button><a href="/games/">← กลับเว็บชมรม</a></div>';
})();
</script>
