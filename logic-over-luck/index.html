<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Logic over Luck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: Sarabun, "Noto Sans Thai", system-ui, sans-serif; background: #0E1326; color: #EEF1FA; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
button[disabled] { cursor: not-allowed; }
.hd { font-family: Prompt, "Noto Sans Thai", sans-serif; }

/* ---------- connection badge ---------- */
#netb { position: fixed; z-index: 60; pointer-events: none; left: 10px; bottom: 6px; font: 12px/1 Sarabun, "Noto Sans Thai", sans-serif; opacity: .85; color: #B4BEDA; }
#netb.ok { color: #5BD98F; } #netb.local { color: #FFD65A; } #netb.bad { color: #FF8A80; }
body.ph #netb { left: auto; bottom: auto; right: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; font-size: 0; background: #9AA5C0; }
body.ph #netb.ok { background: #2E9E6B; } body.ph #netb.local { background: #D9A400; } body.ph #netb.bad { background: #D64545; }

/* ---------- role screen ---------- */
.role { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 16px; max-width: 520px; margin: 0 auto; padding: 24px 16px; }
.role h1 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 2.2rem; margin: 0; line-height: 1.2; }
.role p { margin: 0; color: #B4BEDA; line-height: 1.5; }
.rbtn { min-height: 64px; border-radius: 16px; border: 2px solid #9C8CFF; background: transparent; color: #EEF1FA; font-weight: 700; font-size: 1.15rem; padding: 10px 16px; text-align: left; }
.rbtn.pri { background: #9C8CFF; color: #0E1326; }
.rbtn small { display: block; font-weight: 400; font-size: .9rem; opacity: .9; }
.role a { color: #B4BEDA; }

/* ---------- HOST stage (1920x1080 scaled to the window) ---------- */
#hostwrap { position: fixed; inset: 0; background: #0E1326; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; padding: 36px 64px 28px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
#stage .hdr { height: 120px; display: flex; align-items: center; justify-content: space-between; flex: none; }
#stage .hl { width: 440px; } #stage .hr { width: 440px; display: flex; justify-content: flex-end; align-items: center; gap: 20px; }
#stage .s1 { font-size: 28px; color: #B4BEDA; line-height: 1.3; }
#stage .s2 { font-family: Prompt, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.25; }
#stage .hc { text-align: center; }
#stage .ti { font-family: Prompt, sans-serif; font-weight: 700; font-size: 56px; line-height: 1.2; }
#stage .su { font-size: 30px; color: #B4BEDA; line-height: 1.3; }
#stage .ring { width: 120px; height: 120px; border-radius: 50%; border: 10px solid #9C8CFF; display: flex; align-items: center; justify-content: center; font-family: Prompt, sans-serif; font-weight: 700; font-size: 58px; }
#stage .ring.warn { border-color: #FF5A5F; color: #FF8A80; }
#stage .ring.pz { border-color: #FFD65A; font-size: 30px; }
#stage .main { flex: 1; min-height: 0; display: flex; gap: 40px; overflow: hidden; }
#stage .ftr { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex: none; }
.gb { font-size: 26px; min-height: 56px; padding: 0 26px; border-radius: 14px; border: 2px solid #5A6785; background: transparent; color: #EEF1FA; }
.gb.red { border-color: #FF5A5F; color: #FF8A80; }
.pb { font-family: Prompt, sans-serif; font-weight: 700; font-size: 38px; min-height: 76px; padding: 0 56px; border-radius: 18px; border: 0; background: #9C8CFF; color: #0E1326; }
.pb[disabled] { opacity: .35; }
.card { background: #171E38; border: 3px solid #2B3560; border-radius: 24px; padding: 28px 32px; }
/* lobby */
.lob { flex: 1; display: grid; grid-template-columns: 600px 1fr; gap: 40px; min-height: 0; }
.lob .code { font-family: Prompt, sans-serif; font-weight: 700; font-size: 150px; letter-spacing: 16px; line-height: 1; color: #FFD84D; }
.lob .qr { width: 300px; height: 300px; border-radius: 16px; overflow: hidden; }
.lob .qr svg { width: 100%; height: 100%; display: block; }
.lob .url { font-size: 26px; color: #B4BEDA; word-break: break-all; }
.chips { display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 28px; padding: 6px 8px 6px 20px; border-radius: 99px; background: #232C50; border: 2px solid #2B3560; }
.chip.done { border-color: #5BD98F; } .chip.kill { border-color: #FF5A5F; }
.chip .kx { min-width: 40px; height: 40px; border-radius: 20px; border: 0; background: #2B3560; color: #EEF1FA; font-size: 22px; font-weight: 700; }
.chip.kill .kx { background: #FF5A5F; }
.big2 { font-family: Prompt, sans-serif; font-weight: 700; font-size: 96px; line-height: 1; }
/* dice reference */
.dref { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; width: 100%; align-content: start; }
.dref .d { background: #171E38; border: 3px solid #2B3560; border-radius: 22px; padding: 22px; text-align: center; }
.dref .d .n { font-family: Prompt, sans-serif; font-weight: 700; font-size: 34px; }
.dref .d .f { font-size: 40px; letter-spacing: 6px; margin-top: 10px; font-weight: 700; color: #FFD84D; }
.dref .d.ban { opacity: .45; }
/* reveal grid */
.rv { flex: 1; display: grid; grid-auto-flow: column; gap: 10px 24px; align-content: start; min-height: 0; }
.rr { display: grid; grid-template-columns: 56px 1fr 230px 90px 120px 120px; align-items: center; gap: 10px; background: #171E38; border: 2px solid #2B3560; border-radius: 14px; padding: 0 16px; }
.rr .rk { font-family: Prompt, sans-serif; font-weight: 700; color: #B4BEDA; }
.rr .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.rr .dn { color: #B4BEDA; white-space: nowrap; overflow: hidden; }
.rr .x { font-family: Prompt, sans-serif; font-weight: 700; color: #FFD84D; text-align: center; }
.rr .pt { text-align: right; color: #5BD98F; font-weight: 700; }
.rr .pt.z { color: #8A93B0; }
.rr .ac { text-align: right; font-family: Prompt, sans-serif; font-weight: 700; }
.mv { font-size: .7em; margin-left: 4px; } .mv.up { color: #5BD98F; } .mv.dn { color: #FF8A80; }
.stats { display: flex; gap: 28px; font-size: 28px; color: #B4BEDA; }
.stats b { color: #EEF1FA; }
/* end */
.pod { display: flex; align-items: flex-end; justify-content: center; gap: 28px; height: 600px; }
.pod .col { width: 380px; text-align: center; }
.pod .blk { border-radius: 22px 22px 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 18px; font-family: Prompt, sans-serif; font-weight: 700; font-size: 70px; color: #0E1326; }
.pod .who { font-family: Prompt, sans-serif; font-weight: 700; font-size: 38px; line-height: 1.2; margin-bottom: 12px; word-break: break-word; }
.pod .sc { font-size: 30px; color: #B4BEDA; margin-bottom: 10px; }
.rest { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 26px; }
.rest span { background: #171E38; border: 2px solid #2B3560; border-radius: 99px; padding: 4px 16px; }
/* common-rule cards */
.rcards { display: flex; gap: 24px; justify-content: center; }
.rcard { flex: 1; max-width: 560px; background: #232C50; border: 3px solid #9C8CFF; border-radius: 22px; padding: 22px 26px; }
.rcard .rn { font-family: Prompt, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.2; }
.rcard .re { font-size: 24px; color: #B4BEDA; }
.rcard .rd { font-size: 27px; line-height: 1.4; margin-top: 8px; }
.rcard.win { border-color: #FFD84D; background: #3A3520; } .rcard.lose { opacity: .45; }
.rcard .vt { font-family: Prompt, sans-serif; font-weight: 700; font-size: 48px; color: #FFD84D; margin-top: 10px; }
.rcard.sm { padding: 12px 20px; } .rcard.sm .rn { font-size: 30px; } .rcard.sm .rd { font-size: 22px; margin-top: 4px; }
.rcard.sp { border-color: #FF8A80; }
.lucky { font-family: Prompt, sans-serif; font-weight: 700; font-size: 30px; background: #FFD84D; color: #0E1326; border-radius: 22px; padding: 12px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.lucky b { font-size: 64px; line-height: 1; }
.dref .d .bt { font-size: 26px; color: #FF8A80; font-weight: 700; margin-top: 6px; }
.ovb .ck { width: 34px; height: 34px; }
/* The 67 Event */
.ecard { flex: 1; max-width: 700px; background: #2A2140; border: 4px solid #FFD84D; border-radius: 26px; padding: 28px 32px; }
.ecard .pile { font-size: 24px; color: #FFD84D; font-weight: 700; }
.ecard .en { font-family: Prompt, sans-serif; font-weight: 700; font-size: 52px; line-height: 1.15; }
.ecard .et { font-size: 30px; color: #C9B8FF; }
.ecard .ed { font-size: 28px; line-height: 1.45; margin-top: 12px; }
.ecard.win { background: #3A3520; } .ecard.lose { opacity: .4; }
.ecard .vt { font-family: Prompt, sans-serif; font-weight: 700; font-size: 44px; color: #FFD84D; margin-top: 10px; }
.lordb { font-family: Prompt, sans-serif; font-weight: 700; font-size: 44px; color: #FFD84D; text-align: center; }
.evlist { display: flex; flex-wrap: wrap; gap: 14px 34px; justify-content: center; font-size: 30px; max-width: 1700px; }
.evlist b { color: #FFD84D; }
.brain { background: #2A2140; border: 3px solid #FF8A80; border-radius: 18px; padding: 10px 18px; font-size: 22px; line-height: 1.45; flex: none; }
.brain b { color: #FF8A80; }
.dref .d.npc { border-color: #FFD84D; background: #3A3520; }
.dref .d .nt { font-size: 24px; color: #FFD84D; font-weight: 700; margin-top: 6px; }
.lord { color: #FFD84D; }
/* overlays */
.ov { position: absolute; inset: 0; z-index: 20; background: rgba(5, 8, 20, .85); display: flex; align-items: center; justify-content: center; }
.ovb { width: 1100px; max-height: 960px; overflow: auto; padding: 48px; border-radius: 30px; background: #171E38; border: 3px solid #2B3560; display: flex; flex-direction: column; gap: 22px; font-size: 30px; }
.ovb label { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.ovb input { font: inherit; font-size: 30px; width: 300px; padding: 8px 14px; border-radius: 12px; border: 2px solid #5A6785; background: #0E1326; color: #EEF1FA; }
.ovb input.sm { width: 140px; text-align: center; }

/* ---------- PLAYER (phone) ---------- */
body.ph { background: #F3F6FF; color: #14213D; }
#pw { max-width: 520px; margin: 0 auto; padding: 14px 14px 40px; display: flex; flex-direction: column; gap: 14px; }
.pc { background: #fff; border: 3px solid #14213D; border-radius: 16px; box-shadow: 4px 4px 0 #14213D; padding: 14px 16px; }
.ptop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ptop .t { font-family: Prompt, sans-serif; font-weight: 700; font-size: 1.35rem; line-height: 1.2; }
.ptop .s { font-size: .95rem; color: #4A5578; }
.tm { min-width: 58px; height: 58px; border-radius: 50%; border: 5px solid #9C8CFF; display: flex; align-items: center; justify-content: center; font-family: Prompt, sans-serif; font-weight: 700; font-size: 1.4rem; flex: none; }
.tm.warn { border-color: #D64545; color: #B3261E; }
.sbar { display: flex; justify-content: space-between; gap: 8px; font-size: .95rem; background: #14213D; color: #fff; border-radius: 12px; padding: 8px 12px; }
.sbar b { color: #FFD84D; }
.btn { min-height: 54px; border-radius: 14px; border: 3px solid #14213D; background: #FFD84D; color: #14213D; font-weight: 700; font-size: 1.1rem; padding: 8px 16px; box-shadow: 3px 3px 0 #14213D; }
.btn.alt { background: #fff; }
.btn[disabled] { opacity: .45; box-shadow: none; }
.inp { width: 100%; font: inherit; font-size: 1.3rem; padding: 12px 14px; border-radius: 12px; border: 3px solid #14213D; background: #fff; color: #14213D; }
.lbl { font-weight: 700; margin-bottom: 6px; display: block; }
.err { color: #B3261E; font-weight: 700; }
.ok { color: #14562F; font-weight: 700; }
.muted { color: #4A5578; font-size: .95rem; line-height: 1.5; }
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 2px solid #C9D0E6; border-radius: 12px; background: #fff; color: #14213D; padding: 10px 12px; }
.opt .pr { flex: none; min-width: 34px; height: 34px; border-radius: 17px; background: #FFD84D; border: 2px solid #14213D; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.opt .nm { font-weight: 700; line-height: 1.3; }
.opt .ds { font-size: .88rem; color: #4A5578; line-height: 1.35; }
.opt.on { border: 3px solid #14213D; background: #E9E4FF; }
.opt[disabled] { opacity: .4; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.budget { position: sticky; top: 0; z-index: 5; }
.rule { background: #E9E4FF; border-radius: 12px; padding: 10px 12px; line-height: 1.45; }
.dice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.die { border: 3px solid #14213D; border-radius: 14px; background: #fff; padding: 12px 8px; text-align: center; color: #14213D; }
.die .n { font-weight: 700; font-size: 1.05rem; }
.die .f { font-family: Prompt, sans-serif; font-weight: 700; letter-spacing: 3px; margin-top: 4px; }
.die.on { background: #FFD84D; box-shadow: 3px 3px 0 #14213D; }
.die[disabled] { opacity: .35; }
.roll { font-family: Prompt, sans-serif; font-weight: 700; font-size: 5rem; line-height: 1; text-align: center; }
.steps { display: flex; flex-direction: column; gap: 6px; }
.steps div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed #C9D0E6; padding-bottom: 4px; }
.steps b.p { color: #14562F; } .steps b.m { color: #B3261E; }
.crule { background: #fff; border: 2px solid #9C8CFF; border-radius: 12px; padding: 8px 12px; line-height: 1.45; font-size: .95rem; }
.crule b { color: #4B3FB3; }
.vopt { display: block; width: 100%; text-align: left; border: 3px solid #14213D; border-radius: 14px; background: #fff; color: #14213D; padding: 12px 14px; }
.vopt.on { background: #FFD84D; box-shadow: 3px 3px 0 #14213D; }
.vopt .nm { font-weight: 700; font-size: 1.1rem; } .vopt .ds { font-size: .9rem; color: #4A5578; }
.evc { display: block; width: 100%; text-align: left; border: 3px solid #14213D; border-radius: 14px; background: #2A2140; color: #fff; padding: 12px 14px; }
.evc .pile { font-size: .8rem; color: #FFD84D; font-weight: 700; } .evc .nm { font-weight: 700; font-size: 1.2rem; } .evc .th { color: #C9B8FF; font-size: .95rem; } .evc .ds { font-size: .92rem; line-height: 1.45; margin-top: 4px; }
.evc.on { border-color: #FFD84D; box-shadow: 3px 3px 0 #14213D; background: #3A2F5C; }
.evc[disabled] { opacity: .5; }
.faces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.faces .btn { font-family: Prompt, sans-serif; font-size: 1.8rem; }
.faces .btn.on { background: #14213D; color: #FFD84D; }
.sig { background: #2A2140; color: #FFD84D; border-radius: 12px; padding: 8px 12px; font-weight: 700; line-height: 1.45; }
.verw { background: #FFE9A8; border: 3px solid #14213D; border-radius: 14px; padding: 12px; font-weight: 700; }

/* ---------- animation (step 8, batch 1) ----------
   Animations run only while <body> has the class "ani" (setting on, and the device does not ask for reduced motion).
   Each animated element waits var(--d) and is shifted back by var(--el), the time already spent in its scene, so a redraw in
   the middle carries on where it was and a page opened late shows the end state. The base style of every class is its end state. */
.a-in, .a-ban, .a-tum, .a-roll, .a-land, .a-spin, .a-fx, .a-old { animation-delay: calc(var(--d, 0ms) - var(--el, 0ms)); animation-fill-mode: both; }
body.ani .a-in { animation-name: ain; animation-duration: .45s; animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
body.ph.ani .a-in { animation-duration: .35s; }
@keyframes ain { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
body.ani .bump { display: inline-block; animation: bump .45s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.35); color: #FFD84D; } 100% { transform: scale(1); } }
/* timer rings: progress drawn with SVG (1.1) */
#stage .ring { position: relative; border: 0; }
#stage .ring.pz { border: 10px solid #FFD65A; }
#stage .ring svg, .tm svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
#stage .ring .tr { fill: none; stroke: #2B3560; stroke-width: 10; }
#stage .ring .pr { fill: none; stroke: #9C8CFF; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 326.73px; stroke-dashoffset: calc(326.73px * (1 - var(--p, 1))); transition: stroke-dashoffset .25s linear; }
#stage .ring.warn .pr { stroke: #FF5A5F; }
#stage .ring span, .tm span { position: relative; }
body.ani #stage .ring.warn, body.ani .tm.warn { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.tm { position: relative; border: 0; }
.tm .tr { fill: none; stroke: #DDE2F0; stroke-width: 5; }
.tm .pr { fill: none; stroke: #9C8CFF; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 160.22px; stroke-dashoffset: calc(160.22px * (1 - var(--p, 1))); transition: stroke-dashoffset .25s linear; }
.tm.warn .pr { stroke: #D64545; }
/* round banner (1.3): big, tilted, chunky (Brainrot style) */
.rban { position: absolute; left: 0; right: 0; top: 300px; z-index: 15; pointer-events: none; text-align: center; font-family: Prompt, sans-serif; font-weight: 700; font-size: 180px; line-height: 1;
  color: #FFD84D; text-shadow: 8px 8px 0 #14213D, -4px -4px 0 #FF5AA8, 0 0 40px rgba(255, 216, 77, .5); opacity: 0; visibility: hidden;
  padding: 50px 0; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(5, 8, 20, .92) 40%, rgba(5, 8, 20, 0) 100%); }
.rban small { display: block; font-size: 70px; color: #fff; text-shadow: 5px 5px 0 #14213D, -3px -3px 0 #4DD8FF; margin-top: 10px; }
body.ani .a-ban { animation-name: ban; animation-duration: 1.8s; }
@keyframes ban { 0% { opacity: 0; visibility: visible; transform: scale(.3) rotate(-14deg); } 16% { opacity: 1; transform: scale(1.15) rotate(4deg); }
  26% { transform: scale(1) rotate(-3deg); } 34% { transform: scale(1.03) rotate(-2deg) translateX(-6px); } 40% { transform: scale(1) rotate(-3deg) translateX(5px); } 46% { transform: rotate(-3deg); }
  78% { opacity: 1; visibility: visible; transform: scale(1) rotate(-3deg); } 99% { opacity: 0; visibility: visible; transform: scale(1.5) rotate(-3deg); } 100% { opacity: 0; visibility: hidden; } }
/* the 4 dice (4.6): Standard white and classy, Consistent green with a steady glow, High Risk red-black with sparks, Prime purple crystal with glowing prime faces */
.dref .d { position: relative; overflow: hidden; }
.dref .d.dz-std { background: linear-gradient(160deg, #FFFFFF, #E9E5DA); border-color: #D9C48A; color: #14213D; }
.dref .d.dz-std .f { color: #14213D; }
.dref .d.dz-con { background: linear-gradient(160deg, #1E7A4C, #11512F); border-color: #5BD98F; box-shadow: 0 0 30px rgba(91, 217, 143, .45); }
.dref .d.dz-con .f { color: #E6FFF0; }
.dref .d.dz-risk { background: linear-gradient(160deg, #520E14, #120407); border-color: #FF4D3D; box-shadow: 0 0 26px rgba(255, 77, 61, .35); }
.dref .d.dz-risk .f { color: #FFB199; }
.dref .d.dz-prime { background: linear-gradient(135deg, #5B2DC0 0%, #9D6BFF 32%, #4E22A0 52%, #B48CFF 76%, #44188F 100%); border-color: #E2D3FF; box-shadow: 0 0 28px rgba(180, 140, 255, .45); }
.dref .d.dz-prime .f { color: #EFE6FF; }
.dref .d .bt, .dref .d .nt { position: relative; }
.dref .d.dz-std .bt { color: #B3261E; }
.np { opacity: .55; }
.pf { color: #fff; text-shadow: 0 0 8px #F0D0FF, 0 0 18px #C08BFF, 0 0 30px #9D6BFF; }
body.ani .dz-risk::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .85;
  background-image: radial-gradient(circle, #FFC04D 0 2px, transparent 3px), radial-gradient(circle, #FF5A1F 0 1.5px, transparent 2.5px);
  background-size: 64px 74px, 46px 58px; animation: spark 1.7s linear infinite; }
@keyframes spark { from { background-position: 0 0, 22px 0; } to { background-position: 0 -74px, 22px -58px; } }
.die { transition: transform .15s, box-shadow .15s; position: relative; overflow: hidden; }
.die.dz-std { background: #fff; border-color: #14213D; }

  var old = pr.rerolled && P.firstX && P.firstX.r === st.round ? '<div class="oldx a-old" data-t0="' + t0 + '">ผลเดิม <s>' + P.firstX.x + "</s></div>" : "";
  return old + '<div class="rollbox ' + DIE_CLS[d] + (fx != null ? " x" + fx : "") + ' a-roll" data-t0="' + t0 + '">' +
    '<div class="roll a-land' + (d === "prime" && isPrime(x) ? " pf" : "") + '" data-t0="' + t0 + '">' + x + "</div>" +
    '<div class="rspin a-spin" data-t0="' + t0 + '" data-f="' + LOL.DICE[d].join(",") + '" aria-hidden="true">' + x + "</div>" +
    (fx != null ? '<div class="fx fx' + fx + ' a-fx" data-t0="' + t0 + '" style="--d:900ms" aria-hidden="true"></div>' : "") + "</div>";
}
function stepsHtml(d) {
  var out = [];
  function row(label, v) { out.push("<div><span>" + label + "</span><b class=\"" + (v > 0 ? "p" : v < 0 ? "m" : "") + "\">" + (typeof v === "number" ? sign(v) : v) + "</b></div>"); }
  (d.steps || []).forEach(function (s) {
    if (s.k === "face") row("แต้มหน้าลูกเต๋า" + (d.god ? " (GOD MODE)" : "") + (s.cursed ? " (โดนพากันลงเหว)" : ""), String(s.v));
    else if (s.k === "personal") { if (s.fired) row("กฎส่วนตัวผ่าน: " + esc(effName(s.eff)), s.d); else row("เงื่อนไขของกฎส่วนตัวไม่ผ่าน", "–"); }
    else if (s.k === "next6") row("+6 จากรอบที่แล้ว", 6);
    else if (s.k === "common") row(esc(RULE_T[s.id] || s.id), s.d);
    else if (s.k === "floor") row("ติดลบ ปัดเป็น 0", s.d);
    else if (s.k === "bust") row("เกิน 10 แตก", s.d);
    else if (s.k === "gain") row("ได้จาก " + esc(effName(d.eff)), s.d);
    else if (s.k === "double") row("รอบสุดท้าย คูณ 2", s.d);
  });
  if (d.stolen) row("ถูกหักจากคะแนนสะสม (ขโมย/ตัดหน้า)", -d.stolen);
  if (d.guess !== undefined) {   /* Delulu */
    if (d.gOk) row("Delulu ทาย " + d.guess + " ถูก", "รอด");
    else if (d.delulu) row("Delulu " + (d.guess == null ? "ไม่ได้ทาย" : "ทาย " + d.guess + " ผิด"), d.delulu);
    else row("Delulu " + (d.guess == null ? "ไม่ได้ทาย" : "ทาย " + d.guess + " ผิด") + " แต่มีโล่", 0);
  }
  if (d.crowded) row(esc(RULE_T.crowded), d.crowded);
  if (d.robin) row(esc(RULE_T.robin), d.robin);
  return out.join("");
}

/* =====================================================================
   start: #host = big screen, #join=CODE or #player = phone, nothing = choose
   ===================================================================== */
(function boot() {
  var hs = location.hash || "";
  if (hs === "#host") return hostBoot();
  var mj = hs.match(/^#join=(\d{4})/);
  if (mj || hs === "#player") return playerBoot(mj ? mj[1] : "");
  if (ss("lol-joined")) return playerBoot("");
  document.getElementById("app").innerHTML = '<div class="role"><h1>Logic over Luck</h1><p>เกมลูกเต๋าที่ตรรกะชนะดวง สร้างกฎส่วนตัว เลือกลูกเต๋า แล้วแข่งกัน 12 รอบ</p>' +
    '<button class="rbtn pri" onclick="location.hash=\'#player\';location.reload()">เข้าห้อง<small>ผู้เล่น ใส่รหัสห้องจากจอใหญ่</small></button>' +
    '<button class="rbtn" onclick="location.hash=\'#host\';location.reload()">เปิดจอใหญ่<small>ครู ใช้จอคอมหรือโปรเจกเตอร์</small></button><a href="/games/">← กลับเว็บชมรม</a></div>';
})();
