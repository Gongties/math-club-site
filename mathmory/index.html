<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ภาพจำยังชัดเจน · Mathmory</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Sarabun, "Noto Sans Thai", system-ui, sans-serif; background: #0E1326; color: #EEF1FA; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
button[disabled] { cursor: not-allowed; opacity: .45; }
.hd { font-family: Prompt, "Noto Sans Thai", sans-serif; }
a { color: #9C8CFF; }

/* ---------- connection badge ---------- */
#netb { position: fixed; left: 8px; bottom: 6px; font-size: 11px; color: #B4BEDA; z-index: 40; pointer-events: none; }
#netb.local { color: #FFD65A; } #netb.bad { color: #FF8A80; }

/* ---------- phone pages ---------- */
#pw { max-width: 520px; margin: 0 auto; min-height: 100%; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 12px; }
#pw .box { background: #171E38; border: 1px solid #2B3560; border-radius: 16px; padding: 14px 16px; }
#pw h1 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 1.9rem; line-height: 1.25; margin: 0; }
#pw h2 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 1.25rem; line-height: 1.3; margin: 0 0 6px; }
#pw .muted { color: #B4BEDA; line-height: 1.5; }
#pw .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#pw .top .a { font-size: .85rem; color: #B4BEDA; }
#pw .top .b { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 1.15rem; line-height: 1.3; }
#pw .tm { min-width: 54px; height: 54px; border-radius: 50%; border: 4px solid #9C8CFF; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 1.35rem; flex: none; }
#pw .tag { padding: 4px 12px; border-radius: 99px; background: #2B3560; font-size: .85rem; font-weight: 700; }
#pw .go { min-height: 54px; border-radius: 14px; border: 0; background: #9C8CFF; color: #0E1326; font-weight: 700; font-size: 1.1rem; width: 100%; }
#pw .gh { min-height: 50px; border-radius: 14px; border: 2px solid #9C8CFF; background: transparent; color: #EEF1FA; font-weight: 700; font-size: 1.05rem; width: 100%; }
#pw label { display: block; font-size: .9rem; color: #B4BEDA; margin: 8px 0 4px; }
#pw input { font: inherit; font-size: 1.1rem; min-height: 50px; width: 100%; padding: 8px 12px; color: #EEF1FA; background: #0E1326; border: 1px solid #2B3560; border-radius: 12px; }
#pw .err { padding: 8px 12px; border-radius: 10px; background: #3A1C24; color: #FFB3AD; }
#pw .rule { background: #FFD84D; color: #14213D; border-radius: 16px; padding: 14px 16px; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 1.3rem; line-height: 1.4; text-align: center; }
#pw .slot { height: 118px; flex: none; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
#pw .slot.memo { background: #171E38; border: 1px solid #2B3560; border-radius: 16px; text-align: center; padding: 8px 14px; }
#pw .rule small { display: block; font-family: Sarabun, "Noto Sans Thai", sans-serif; font-weight: 500; font-size: .9rem; }
#pw .row { display: flex; gap: 8px; }
#pw .tr { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid #2B3560; }
#pw .tr:last-child { border-bottom: 0; }
#pw .tr.me { background: #232C55; border-radius: 8px; }
#pw .ok { color: #6EDC9A; } #pw .no { color: #FF8A80; }
#pw .num3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
/* the 3x3 board on phones */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 360px; margin: 0 auto; }
.grid.n4 { grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 420px; } .grid.n4 .cell { font-size: 2.1rem; }
.grid.n5 { grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 440px; } .grid.n5 .cell { font-size: 1.6rem; border-radius: 10px; } .grid.n5 .cell .ord { top: 2px; left: 3px; min-width: 18px; height: 18px; line-height: 18px; font-size: .75rem; }
.cell { aspect-ratio: 1; border-radius: 14px; border: 2px solid #2B3560; background: #05070F; color: #14213D; display: flex; align-items: center; justify-content: center; position: relative; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 3rem; padding: 0; }
.cell.p { background: #FF8FC8; border-color: #FF8FC8; } .cell.g { background: #63D68F; border-color: #63D68F; } .cell.w { background: #F4F6FB; border-color: #F4F6FB; }
.cell.sel { border: 3px solid #FFD84D; box-shadow: 0 0 0 2px #FFD84D inset; }
.cell .ord { position: absolute; top: 4px; left: 6px; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 8px; background: #FFD84D; color: #14213D; font-size: .95rem; line-height: 24px; text-align: center; }
.cell.ex { box-shadow: 0 0 0 4px #9C8CFF; }
.cell .mine { position: absolute; right: 4px; bottom: 3px; font-size: .7rem; color: #14213D; background: #FFD84D; border-radius: 6px; padding: 0 4px; line-height: 16px; }

/* ---------- role screen ---------- */
.role { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 520px; margin: 0 auto; padding: 24px 16px; }
.role h1 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-size: 2rem; margin: 0; line-height: 1.3; }
.role p { margin: 0; color: #B4BEDA; line-height: 1.5; }
.rbtn { min-height: 64px; border-radius: 16px; border: 2px solid #9C8CFF; background: transparent; color: #EEF1FA; font-weight: 700; font-size: 1.15rem; padding: 10px 16px; text-align: left; }
.rbtn.pri { background: #9C8CFF; color: #0E1326; }
.rbtn small { display: block; font-weight: 400; font-size: .9rem; opacity: .9; }

/* ---------- host (1920x1080 stage, scaled to fit) ---------- */
body.host { overflow: hidden; background: #0A0E1D; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; padding: 40px 64px; display: flex; flex-direction: column; gap: 24px; overflow: hidden; color: #EEF1FA; background: #0E1326; }
#stage .hdr { height: 110px; display: flex; align-items: center; justify-content: space-between; flex: none; gap: 24px; }
#stage .s1 { font-size: 30px; color: #B4BEDA; white-space: nowrap; }
#stage .s2 { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 46px; line-height: 1.2; }
#stage .ring { width: 120px; height: 120px; border-radius: 50%; border: 10px solid #9C8CFF; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 60px; flex: none; }
#stage .main { flex: 1; min-height: 0; display: flex; align-items: center; gap: 64px; }
#stage .ftr { height: 72px; display: flex; align-items: center; justify-content: space-between; flex: none; }
#stage .pb { min-height: 72px; padding: 0 44px; border-radius: 18px; border: 0; background: #9C8CFF; color: #0E1326; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 36px; }
#stage .gb { min-height: 60px; padding: 0 28px; border-radius: 16px; border: 3px solid #5A6785; background: transparent; color: #EEF1FA; font-size: 28px; font-weight: 700; }
#stage .hgrid { display: grid; grid-template-columns: repeat(3, 236px); gap: 22px; flex: none; }
#stage .hgrid.n4 { grid-template-columns: repeat(4, 176px); gap: 18px; } #stage .hgrid.n4 .hcell { width: 176px; height: 176px; font-size: 104px; }
#stage .hgrid.n5 { grid-template-columns: repeat(5, 142px); gap: 14px; } #stage .hgrid.n5 .hcell { width: 142px; height: 142px; font-size: 84px; border-radius: 18px; }
#stage .hcell { width: 236px; height: 236px; border-radius: 24px; background: #05070F; border: 4px solid #2B3560; display: flex; align-items: center; justify-content: center; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 140px; color: #14213D; position: relative; }
#stage .hcell.p { background: #FF8FC8; border-color: #FF8FC8; } #stage .hcell.g { background: #63D68F; border-color: #63D68F; } #stage .hcell.w { background: #F4F6FB; border-color: #F4F6FB; }
#stage .hcell.ex { box-shadow: 0 0 0 10px #FFD84D; }
#stage .hcell .ord { position: absolute; top: 8px; left: 10px; min-width: 44px; height: 44px; border-radius: 12px; background: #FFD84D; color: #14213D; font-size: 30px; line-height: 44px; text-align: center; padding: 0 6px; }
#stage .side { width: 800px; flex: none; display: flex; flex-direction: column; gap: 26px; }
#stage .rulebig { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 64px; line-height: 1.3; background: #FFD84D; color: #14213D; border-radius: 32px; padding: 36px 44px; }
#stage .chip { display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px; border-radius: 99px; background: #171E38; border: 3px solid #2B3560; font-size: 34px; font-weight: 700; }
#stage .chip.sm { font-size: 26px; padding: 6px 16px; }
#stage .chip i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
#stage .lr { display: flex; align-items: center; gap: 22px; padding: 10px 22px; border-radius: 18px; background: #171E38; font-size: 36px; }
#stage .lr .rk { width: 56px; color: #B4BEDA; font-weight: 700; }
#stage .lr .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
#stage .lr .pt { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; color: #FFD84D; }
#stage .lr .sub { font-size: 26px; color: #B4BEDA; }
#stage .field { display: flex; align-items: center; justify-content: space-between; gap: 18px; font-size: 30px; }
#stage .field input { font: inherit; width: 150px; min-height: 60px; padding: 4px 14px; color: #EEF1FA; background: #05070F; border: 2px solid #2B3560; border-radius: 14px; font-size: 32px; }
#stage .field input.wide { width: 360px; }
.endov { position: absolute; inset: 0; background: rgba(5, 8, 20, .82); display: flex; align-items: center; justify-content: center; z-index: 20; }
.endbox { background: #171E38; border: 3px solid #2B3560; border-radius: 32px; padding: 48px 64px; text-align: center; display: flex; flex-direction: column; gap: 18px; }
@media (prefers-reduced-motion: no-preference) { .pop { animation: pop .35s ease both; } @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } } }

/* ============================================================ animations (2026-11-23)
   Every animated element carries --d = its start time minus the time already spent on the screen (see dv()), so a screen that is
   drawn again in the middle (a new state every 3 s on the phones) continues where it was instead of starting over.
   The keyframes only say where an element comes FROM: without animations (reduced motion) everything simply shows its final look. */
#stage .ring.warn, #pw .tm.warn { border-color: #FF5A5F; color: #FF8A80; }
.dim2 { opacity: .35; filter: saturate(.4); }
#stage .hcell.gold { box-shadow: 0 0 0 10px #FFD84D, 0 0 40px 10px rgba(255, 216, 77, .5); }
#stage .hcell.q { color: #2B3560; font-size: 110px; }
#stage .hgrid.n4 .hcell.q { font-size: 84px; } #stage .hgrid.n5 .hcell.q { font-size: 64px; }
#stage .hcell .cnt { position: absolute; top: -18px; right: -18px; min-width: 64px; height: 64px; border-radius: 32px; padding: 0 12px; background: #14213D; color: #EEF1FA; border: 4px solid #EEF1FA; font-size: 36px; line-height: 56px; text-align: center; z-index: 2; }
#stage .hgrid.n5 .hcell .cnt, #stage .hgrid.n4 .hcell .cnt { top: -12px; right: -12px; min-width: 50px; height: 50px; font-size: 28px; line-height: 42px; }
#stage .hcell .cnt.one { background: #FFD84D; color: #14213D; border-color: #14213D; }
#stage .hcell .stamp { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%) rotate(-8deg); padding: 2px 14px; border: 5px solid #FF5A5F; color: #FF5A5F; background: rgba(14, 19, 38, .9); border-radius: 12px; font-size: 32px; line-height: 1.2; white-space: nowrap; z-index: 2; }
#stage .hgrid.n5 .hcell .stamp, #stage .hgrid.n4 .hcell .stamp { font-size: 22px; border-width: 3px; padding: 0 8px; }
#stage .hcell .who { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); background: #FFD84D; color: #14213D; font-family: Sarabun, sans-serif; font-size: 24px; padding: 0 12px; border-radius: 10px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; z-index: 2; }
/* multiplier banner and the "เตรียมพร้อม" countdown */
.ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 15; background: rgba(7, 10, 22, .92); }
.ov.final { background: radial-gradient(circle at 50% 52%, rgba(255, 216, 77, .30), rgba(7, 10, 22, .95) 58%); }
.ov.cd { background: rgba(7, 10, 22, .55); justify-content: flex-start; padding-top: 80px; }
.ov .mq { font-size: 48px; color: #B4BEDA; font-weight: 700; }
.ov .mx { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 340px; line-height: 1; margin: 10px 0 6px; transform: rotate(-4deg); position: relative; }
.ov.final .mx { color: #FFD84D; text-shadow: 0 0 60px rgba(255, 216, 77, .8); font-size: 400px; }
.ov .burst { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; border: 10px solid currentColor; opacity: 0; }
.ov .msub { font-size: 52px; font-weight: 700; }
.ov .mlast { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 96px; color: #FFD84D; }
.ov .spark { position: absolute; color: #FFD84D; font-size: 70px; }
.ov .cdt { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 110px; text-align: center; line-height: 1.2; }
.ov .cdt small { display: block; font-family: Sarabun, sans-serif; font-weight: 500; font-size: 40px; color: #B4BEDA; }
.ov .cdn { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 380px; line-height: 1; color: #FFD84D; margin-top: 30px; text-shadow: 0 0 40px #0E1326; }
#pw .pmx { text-align: center; padding: 26px 10px; }
#pw .pmx .x { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 7rem; line-height: 1; display: inline-block; transform: rotate(-4deg); }
#pw .pcd { text-align: center; padding: 14px 10px; }
#pw .pcd .n { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 7.5rem; line-height: 1; color: #FFD84D; display: inline-block; }
/* who has answered (big screen) */
#stage .adots { display: flex; flex-wrap: wrap; gap: 10px; max-height: 330px; overflow: hidden; }
#stage .adot { padding: 4px 16px; border-radius: 99px; font-size: 24px; font-weight: 700; border: 3px solid #2B3560; color: #5A6785; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#stage .adot.on { color: #0E1326; border-color: transparent; }
/* crowd reveal charts */
#stage .rulesm { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 38px; line-height: 1.3; background: #FFD84D; color: #14213D; border-radius: 24px; padding: 16px 26px; }
#stage .bars { display: flex; gap: 36px; align-items: flex-end; height: 360px; padding: 0 10px; }
#stage .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100%; justify-content: flex-end; position: relative; }
#stage .bar .col { width: 100%; border-radius: 18px 18px 6px 6px; }
#stage .bar .num { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 60px; line-height: 1; }
#stage .bar .lab { font-size: 32px; font-weight: 700; }
#stage .bar.win .col { box-shadow: 0 0 0 8px #FFD84D, 0 0 40px rgba(255, 216, 77, .6); }
#stage .bar.tie .col { box-shadow: 0 0 0 8px #FF5A5F; }
#stage .bar .flag { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); background: #FFD84D; color: #14213D; font-weight: 700; font-size: 28px; padding: 2px 16px; border-radius: 12px; white-space: nowrap; }
#stage .bar.tie .flag { background: #FF5A5F; color: #fff; }
#stage .digs { display: flex; gap: 10px; align-items: flex-end; height: 320px; }
#stage .dig { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; border-radius: 16px; padding: 8px 0; position: relative; }
#stage .dig .dots { display: flex; flex-direction: column-reverse; gap: 5px; align-items: center; }
#stage .dig .dots i { width: 30px; height: 30px; border-radius: 50%; display: block; }
#stage .dig .d { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 52px; line-height: 1; }
#stage .dig .mk { position: absolute; top: 4px; font-size: 40px; font-weight: 700; }
#stage .dig.x .mk { color: #FF8A80; } #stage .dig.ok { background: #FFD84D; color: #14213D; }
#stage .crow { display: flex; align-items: center; gap: 16px; background: #171E38; border-radius: 16px; padding: 3px 18px; font-size: 28px; }
#stage .crow .d { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 40px; width: 50px; text-align: center; }
#stage .crow .f { flex: 1; color: #B4BEDA; }
#stage .crow .pt { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; color: #FFD84D; font-size: 32px; }
#stage .res { font-size: 34px; line-height: 1.45; font-weight: 700; }
#stage .res.bad { color: #FF8A80; }
#stage .nmc { display: inline-block; background: #FFD84D; color: #14213D; border-radius: 12px; padding: 0 14px; margin: 4px 6px 0 0; font-size: 28px; }
/* standings between questions */
#stage .lbw { display: flex; flex-direction: column; gap: 10px; max-width: 1300px; width: 100%; margin: 0 auto; }
#stage .lbw .lr { font-size: 36px; padding: 8px 26px; height: 76px; }
#stage .lbw .lr.me1 { border: 4px solid #FFD84D; }
#stage .mv { font-size: 30px; font-weight: 700; width: 90px; text-align: center; }
#stage .mv.up { color: #6EDC9A; } #stage .mv.dn { color: #FF8A80; } #stage .mv.eq { color: #5A6785; }
#stage .gain { font-size: 28px; font-weight: 700; color: #6EDC9A; background: #16342A; border-radius: 10px; padding: 0 12px; }
/* podium */
#stage .pod { display: flex; align-items: flex-end; justify-content: center; gap: 30px; height: 600px; }
#stage .pcol { width: 400px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
#stage .pnm { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 52px; line-height: 1.15; text-align: center; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#stage .pnm.sm { font-size: 34px; }
#stage .pblk { width: 100%; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 18px; color: #14213D; font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; transform-origin: bottom; }
#stage .pblk .r { font-size: 110px; line-height: 1; } #stage .pblk .s { font-size: 40px; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 12; }
.confetti i { position: absolute; top: -40px; width: 18px; height: 30px; border-radius: 4px; opacity: 0; }
#pw .confetti i { width: 9px; height: 15px; }
/* phone: result of a question */
#pw .resbig { text-align: center; }
#pw .resbig .mk { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 1.9rem; line-height: 1.2; }
#pw .resbig .pts { font-family: Prompt, "Noto Sans Thai", sans-serif; font-weight: 700; font-size: 2.6rem; line-height: 1.1; color: #FFD84D; }
#pw .rk { display: flex; justify-content: space-between; align-items: center; }
#pw .arw { font-weight: 700; padding: 2px 10px; border-radius: 99px; background: #232C55; }
#pw .arw.up { color: #6EDC9A; } #pw .arw.dn { color: #FF8A80; } #pw .arw.eq { color: #B4BEDA; }
.grid .cell .cnt { position: absolute; top: -8px; right: -8px; min-width: 26px; height: 26px; border-radius: 13px; padding: 0 6px; background: #14213D; color: #EEF1FA; border: 2px solid #EEF1FA; font-size: .85rem; line-height: 22px; font-family: Sarabun, sans-serif; z-index: 2; }
/* lobby: remove a player, scroll the list */
#stage .plist { display: flex; flex-wrap: wrap; gap: 16px; align-content: flex-start; flex: 1; min-height: 0; overflow-y: auto; padding-right: 8px; }
#stage .plist::-webkit-scrollbar { width: 14px; } #stage .plist::-webkit-scrollbar-thumb { background: #2B3560; border-radius: 7px; }
#stage .plist .chip { font-size: 28px; padding: 6px 8px 6px 18px; gap: 10px; }
#stage .kx { min-width: 44px; height: 44px; border-radius: 22px; border: 0; background: #2B3560; color: #EEF1FA; font-size: 24px; font-weight: 700; padding: 0 10px; margin-left: 4px; }

<script>
/* ============================================================ GAME LOGIC ============================================================
   Mathmory (ภาพจำยังชัดเจน): a 3x3 board of digits 0-9 in pink / green / white is shown for a few seconds, then every cell turns black,
   a rule appears and the players tap the cells that satisfy it (one answer each). Correct = seconds left (to 0.1) + bonus 10 / (number correct)
   (big-screen mode only), times the question's multiplier. */
var MM_V = 2026112301;   /* page version: RAISE THIS NUMBER EVERY TIME THIS FILE CHANGES (YYYYMMDD + 2 digits) */
/* board size: 3x3, 4x4 or 5x5, chosen before the game (setSize). One page runs one game, so plain globals are enough. */
var N = 3, CELLS = 9;
function setSize(n) { n = Number(n); N = n === 4 || n === 5 ? n : 3; CELLS = N * N; }
/* number of cells a rule asks for: a number, or one number per board size, or null (= "all cells that ...") */
function K(R) { return R.k !== null && typeof R.k === "object" ? R.k[N] : R.k; }
var COLORS = [{ id: "p", name: "ชมพู" }, { id: "g", name: "เขียว" }, { id: "w", name: "ขาว" }];
var PRIMES = { 2: 1, 3: 1, 5: 1, 7: 1 };
function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function genGrid() { var g = []; for (var i = 0; i < CELLS; i++) g.push({ n: rint(0, 9), c: rint(0, 2) }); return g; }
function pairs(f) { for (var i = 0; i < CELLS; i++) for (var j = i + 1; j < CELLS; j++) f(i, j); }
function triples(f) { for (var i = 0; i < CELLS; i++) for (var j = i + 1; j < CELLS; j++) for (var k = j + 1; k < CELLS; k++) f(i, j, k); }
function adjacent(i, j) { var ri = Math.floor(i / N), ci = i % N, rj = Math.floor(j / N), cj = j % N; return Math.abs(ri - rj) + Math.abs(ci - cj) === 1; }
function uniq(sel) { return sel.every(function (x, i) { return sel.indexOf(x) === i; }); }
function sumOf(g, sel) { return sel.reduce(function (s, i) { return s + g[i].n; }, 0); }
/* ---------- the rules ----------
   One entry per rule. tier: 1 = easy (×1 questions), 2 = medium (×2), 3 = hard (×3 and ×4).
   k = number of cells to pick (null = "all cells that ..."; the player decides how many).
   make(grid) -> params, or null when this board has no answer (a new board is drawn then).
   text(params) -> the rule shown to the players.  ok(grid, sel, params) -> is the answer right (sel = cell numbers 0..CELLS-1 in tap order).
   ex(grid, params) -> one right answer, shown on the reveal screen.
   To add a rule: add one entry here. */
var RULES = {
  same4: { tier: 1, k: { 3: 4, 4: 4, 5: 5 },
    make: function (g) { var k = K(RULES.same4), cs = [0, 1, 2].filter(function (c) { return g.filter(function (x) { return x.c === c; }).length >= k; }); return cs.length ? {} : null; },
    text: function () { return "เลือก " + K(RULES.same4) + " ช่อง ที่มีสีเหมือนกัน"; },
    ok: function (g, s) { return s.every(function (i) { return g[i].c === g[s[0]].c; }); },
    ex: function (g) { for (var c = 0; c < 3; c++) { var l = []; g.forEach(function (x, i) { if (x.c === c) l.push(i); }); if (l.length >= K(RULES.same4)) return l.slice(0, K(RULES.same4)); } return []; } },
  prime3: { tier: 1, k: 3,
    make: function (g) { return g.filter(function (x) { return PRIMES[x.n]; }).length >= 3 ? {} : null; },
    text: function () { return "เลือก 3 ช่อง ที่เป็นจำนวนเฉพาะ"; },
    ok: function (g, s) { return s.every(function (i) { return PRIMES[g[i].n]; }); },
    ex: function (g) { var l = []; g.forEach(function (x, i) { if (PRIMES[x.n]) l.push(i); }); return l.slice(0, 3); } },
  diff2: { tier: 1, k: 2,
    make: function (g) { var ds = {}; pairs(function (i, j) { var d = Math.abs(g[i].n - g[j].n); if (d > 0) ds[d] = 1; }); var l = Object.keys(ds); return l.length ? { d: Number(pick(l)) } : null; },
    text: function (p) { return "เลือก 2 ช่อง ที่ผลต่างเป็น " + p.d; },
    ok: function (g, s, p) { return Math.abs(g[s[0]].n - g[s[1]].n) === p.d; },

  prod2: { tier: 1, k: 2,
    make: function (g) { var ps = {}; pairs(function (i, j) { var v = g[i].n * g[j].n; if (v > 0) ps[v] = 1; }); var l = Object.keys(ps); return l.length ? { v: Number(pick(l)) } : null; },
    text: function (p) { return "เลือก 2 ช่อง ที่ผลคูณเป็น " + p.v; },
    ok: function (g, s, p) { return g[s[0]].n * g[s[1]].n === p.v; },

  sum3: { tier: 2, k: 3,
    make: function (g) { var ss = {}; triples(function (i, j, k) { ss[g[i].n + g[j].n + g[k].n] = 1; }); var l = Object.keys(ss).filter(function (v) { return v >= 4 && v <= 25; }); return l.length ? { v: Number(pick(l)) } : null; },
    text: function (p) { return "เลือก 3 ช่อง ที่ผลรวมเป็น " + p.v; },

  distinct3: { tier: 2, k: 3,
    make: function (g) { return RULES.distinct3.ex(g).length ? {} : null; },
    text: function () { return "เลือก 3 ช่อง ที่มีสีและตัวเลขไม่ซ้ำกัน"; },
    ok: function (g, s) { var a = g[s[0]], b = g[s[1]], c = g[s[2]]; return a.c !== b.c && a.c !== c.c && b.c !== c.c && a.n !== b.n && a.n !== c.n && b.n !== c.n; },
    ex: function (g) { var r = null; triples(function (i, j, k) { if (!r && RULES.distinct3.ok(g, [i, j, k])) r = [i, j, k]; }); return r || []; } },
  colorOdd3: { tier: 2, k: 3,
    make: function (g) { var cs = [0, 1, 2].filter(function (c) { return g.filter(function (x) { return x.c === c && x.n % 2 === 1; }).length >= 3; }); return cs.length ? { c: pick(cs) } : null; },
    text: function (p) { return "เลือก 3 ช่องสี" + COLORS[p.c].name + " ที่เป็นเลขคี่"; },
    ok: function (g, s, p) { return s.every(function (i) { return g[i].c === p.c && g[i].n % 2 === 1; }); },
    ex: function (g, p) { var l = []; g.forEach(function (x, i) { if (x.c === p.c && x.n % 2 === 1) l.push(i); }); return l.slice(0, 3); } },
  sum3mod7: { tier: 2, k: 3,
    make: function (g) { return RULES.sum3mod7.ex(g).length ? {} : null; },
    text: function () { return "เลือก 3 ช่อง ที่ผลรวมหารด้วย 7 ลงตัว"; },
    ok: function (g, s) { return sumOf(g, s) % 7 === 0; },
    ex: function (g) { var r = null; triples(function (i, j, k) { if (!r && (g[i].n + g[j].n + g[k].n) % 7 === 0) r = [i, j, k]; }); return r || []; } },
  inc: { tier: 3, k: { 3: 4, 4: 5, 5: 6 },
    make: function (g) { var d = {}; g.forEach(function (x) { d[x.n] = 1; }); return Object.keys(d).length >= K(RULES.inc) ? {} : null; },
    text: function () { return "เลือก " + K(RULES.inc) + " ช่อง ให้เลขเรียงจากน้อยไปมาก"; },
    ok: function (g, s) { for (var i = 1; i < s.length; i++) if (g[s[i]].n <= g[s[i - 1]].n) return false; return true; },
    ex: function (g) { var seen = {}, l = []; g.map(function (x, i) { return i; }).sort(function (a, b) { return g[a].n - g[b].n; }).forEach(function (i) { if (!seen[g[i].n]) { seen[g[i].n] = 1; l.push(i); } }); return l.slice(0, K(RULES.inc)); } },
  even: { tier: 3, k: { 3: 4, 4: 8, 5: 10 },
    make: function (g) { return g.filter(function (x) { return x.n % 2 === 0; }).length >= K(RULES.even) ? {} : null; },
    text: function () { return "เลือก " + K(RULES.even) + " ช่อง ที่เป็นจำนวนคู่"; },
    ok: function (g, s) { return s.every(function (i) { return g[i].n % 2 === 0; }); },
    ex: function (g) { var l = []; g.forEach(function (x, i) { if (x.n % 2 === 0) l.push(i); }); return l.slice(0, K(RULES.even)); } },
  adjSum: { tier: 3, k: 2,
    make: function (g) { var ss = {}; pairs(function (i, j) { if (adjacent(i, j)) ss[g[i].n + g[j].n] = 1; }); var l = Object.keys(ss).filter(function (v) { return v > 0; }); return l.length ? { v: Number(pick(l)) } : null; },
    text: function (p) { return "เลือก 2 ช่อง ที่อยู่ติดกัน (บน ล่าง ซ้าย ขวา) และผลรวมเป็น " + p.v; },

    ex: function (g, p) { var r = null; pairs(function (i, j) { if (!r && adjacent(i, j) && g[i].n + g[j].n === p.v) r = [i, j]; }); return r || []; } },
  allOf: { tier: 3, k: null,
